<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<title>사랑한다고 해 줘</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
:root{--bg:#14102a;--fg:#f6eefc;--pk:#ff8fb1;--bl:#8fb6ff;--red:#ff8fb1;--moon:#f6eefc;--mist:#b9b0d0;--lamp:#ff8fb1;--frost:#8fb6ff;--ln:#ffffff44;
 --serif:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;--pix:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--pix);overflow:hidden}
#app{position:relative;height:100%;max-width:480px;margin:auto;overflow:hidden;background:var(--bg)}
/* scene */
#bg{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#3b2f4f,#1c1730)}
#bgi,#cg{position:absolute;left:0;right:0;top:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 210px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 80%,#0000);mask-image:linear-gradient(#000 80%,#0000);transition:opacity .4s}

#bg::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(#14102a66 0,#14102a00 16%,#14102a00 52%,#14102a99 74%,#14102a 100%)}
.dorm,.fruit,.kneel,.kitchen,.alone,.phone,.bed,.hood,.jelly,.morn,.prac,.ter{background:linear-gradient(#3b2f4f,#1c1730)}
#fd{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:9;transition:opacity .3s}
/* phone */
#ph{position:absolute;left:0;right:0;top:64px;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 250px);display:none;align-items:center;justify-content:center;z-index:1}
#ph.on{display:flex}
#phi{position:relative;height:100%;aspect-ratio:9/16;max-width:78%;border-radius:26px;background:linear-gradient(#2a2145,#14102a 65%,#0d0a1d);container-type:inline-size;color:var(--fg);font-family:var(--pix);box-shadow:0 0 0 6px #0a0618,0 0 0 7px #ffffff44,0 24px 50px #0009,0 0 40px #ff8fb122;overflow:hidden}
#phc{position:absolute;left:8%;top:3.5%;font-size:4.2cqw}

#phs{position:absolute;left:0;right:0;top:33%;text-align:center;font-size:4.6cqw;color:#d6cce8}
#phd{position:absolute;left:0;right:0;top:39%;display:flex;justify-content:center;gap:3cqw}
#phd i{width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--pk);animation:pd 1.2s steps(1) infinite}
#phd i:nth-child(2){animation-delay:.4s}#phd i:nth-child(3){animation-delay:.8s}
@keyframes pd{0%{opacity:1}33%{opacity:.25}66%{opacity:.25}}
#phd.hide{display:none}
#pht{position:absolute;left:0;right:0;top:38.5%;text-align:center;font-size:3.8cqw;color:#b9b0d0;display:none}

#pbt span{display:flex;flex-direction:column;align-items:center;gap:2.4cqw;font-size:3.4cqw;color:#d6cce8}
#pbt i{display:grid;place-items:center;width:17cqw;height:17cqw;border-radius:50%;background:#ffffff1a;font-style:normal;font-size:6cqw;filter:grayscale(1)}
#phe{position:absolute;left:50%;top:76%;width:18cqw;height:18cqw;margin-left:-9cqw;border-radius:50%;background:#ff6b8f;display:grid;place-items:center;transition:opacity .3s}
#phe i{width:8cqw;height:3cqw;border-radius:3cqw 3cqw 1cqw 1cqw;background:#fff}
#phx,#phy,#pmt{display:none!important}
#ph.off #pht{display:block}
#ph.off #pbt,#ph.off #phe{opacity:.3}
/* chat */
#chat{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 250px);display:none;flex-direction:column;background:#120d28e6;border:1px solid #fff4;border-radius:16px;z-index:1;box-shadow:0 14px 40px #0008}
#chat.on{display:flex}
#chat header{padding:11px 16px;border-bottom:1px solid #fff2;font-size:15px;text-align:center}
#cl{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
#cl::-webkit-scrollbar{display:none}
#cl p{max-width:76%;padding:8px 13px;font-size:15px;line-height:1.5;word-break:keep-all;border-radius:16px}
#cl .H{position:relative;align-self:flex-end;background:var(--pk);color:#2a1030;border-bottom-right-radius:5px}
#cl .Y{align-self:flex-start;background:#ffffff1c;color:var(--fg);border-bottom-left-radius:5px}
#cl .H+.Y,#cl .Y+.H{margin-top:8px}
#cl .H.u::before{content:"1";position:absolute;right:calc(100% + 6px);bottom:2px;font-size:12px;line-height:1;color:#ffe066}
#cl .tyb{display:flex;gap:4px;align-items:center;padding:12px 14px}
#cl .tyb i{width:6px;height:6px;border-radius:50%;background:#d6cce8;animation:tyd 1s ease-in-out infinite}
#cl .tyb i:nth-child(2){animation-delay:.15s}#cl .tyb i:nth-child(3){animation-delay:.3s}
@keyframes tyd{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
#cl p.new{animation:pop .28s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
#box.tin,#box.tin small{visibility:hidden!important}
#tap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 90px);text-align:center;font-size:13px;color:var(--mist);display:none;z-index:3;pointer-events:none;animation:bl 1.6s steps(2) infinite}
#tap.on{display:block}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:2}
#game.scr{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 9vh)}
.hide{display:none!important}
/* buttons */
.mb{display:block;width:min(260px,80%);margin:6px auto;font-family:var(--pix);font-size:18px;color:var(--fg);background:#ffffff14;border:1.5px solid #ffffff55;border-radius:12px;padding:12px;cursor:pointer;transition:background .2s,border-color .2s}
.mb:hover,.mb:focus-visible{background:#ff8fb12b;border-color:var(--pk);outline:0}
button:focus-visible{outline:3px solid var(--pk)}
/* title */
#menu{z-index:6;align-items:center;justify-content:flex-end;text-align:center;background:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 9vh)}
#menu::before{content:"";position:absolute;inset:0;z-index:-1;--ph:calc(min(100vw,480px)*1.1335);background:linear-gradient(#14102a8c,#14102a00 12%) top/100% var(--ph) no-repeat,linear-gradient(#14102a00 38%,#14102ab3 66%,#14102a 96%) top/100% var(--ph) no-repeat,radial-gradient(ellipse 80% 60% at 50% 40%,#14102a00 60%,#14102a80 100%) top/100% var(--ph) no-repeat,linear-gradient(#2a1d5a47,#2a1d5a47) top/100% var(--ph) no-repeat,url(q_cover2.jpg) top center/100% auto no-repeat;background-color:#14102a}
#menu>*{position:relative}
.cv{margin-bottom:28px}
#menu h1{font-weight:400;font-size:clamp(32px,9.5vw,52px);line-height:1.2;margin-bottom:10px;text-shadow:0 0 24px var(--pk);white-space:nowrap}
.cv-d{display:none}
.cv-s{opacity:.8;font-size:15px}
.mw{width:100%;display:flex;flex-direction:column;align-items:center}
#menu .cv-n{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;font-size:12px;opacity:.6}
.devb{margin:10px auto 0;font-family:var(--pix);font-size:13px;color:#ffd6e4;background:#0006;border:1px dashed #ff8fb188;border-radius:999px;padding:6px 14px;cursor:pointer}
/* game chrome */
#bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:8px;right:8px;display:flex;justify-content:flex-end;gap:3px;z-index:5}
#bar button{font-family:var(--pix);font-size:11px;letter-spacing:-.02em;color:var(--fg);background:#0007;border:1px solid #fff4;border-radius:999px;padding:4px 6px;cursor:pointer;white-space:nowrap}
#bar button.on{background:var(--pk);color:#2a1030;border-color:var(--pk)}
#bk{margin-right:auto}
#chap{display:none}
#nm{align-self:flex-start;margin:0 0 -10px 12px;position:relative;z-index:3;box-shadow:0 2px 8px #0004;background:var(--pk);color:#2a1030;border-radius:999px;padding:2px 14px;font-size:15px}
#nm.nY{background:var(--bl);color:#10203a}
#nm.nM{background:#ffd6e4;color:#2a1030}
#nm.nG{background:#b6e88f;color:#1c2e10}
#box{position:relative;min-height:158px;max-height:230px;overflow-y:auto;padding:20px 18px 30px;font-size:17px;line-height:1.8;word-break:keep-all;cursor:pointer;color:#2a2140;background:#fbf8ffee;border:1px solid #fff;border-radius:14px;scrollbar-width:none;box-shadow:0 8px 28px #0007}
#box::-webkit-scrollbar{display:none}
#box.mono{color:#fff0f6;background:linear-gradient(160deg,#4a3a75f0 0%,#6a4588f0 60%,#8d4c90f0 100%);border:1px solid #ffb3d166;box-shadow:0 0 24px #ff8fb166,0 8px 28px #0008}
#box.nar{color:#3a3150}
#box small{position:absolute;right:12px;bottom:6px;color:#7a6c96;opacity:.8;font-size:12px;visibility:hidden}
#box small::after{content:"▼"}
#box.done small{visibility:visible}
@keyframes bl{50%{opacity:0}}
#ch{display:flex;flex-direction:column;gap:11px;margin-bottom:12px;position:relative;z-index:6}
#ch button{font-family:var(--pix);font-size:17px;color:#2a2140;background:#fbf8ffee;border:1px solid #fff;border-left:4px solid var(--bl);border-radius:14px;padding:15px 16px;text-align:left;cursor:pointer;word-break:keep-all;line-height:1.5;box-shadow:0 6px 20px #0006;transition:background .2s,transform .15s}
#ch button:hover,#ch button:focus-visible{background:#eef3ff;transform:translateX(3px);outline:0}
/* overlays */
#ov{background:#0a0618f2;justify-content:flex-start;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 30px;z-index:8}
#ov>small{color:var(--pk);letter-spacing:.1em;font-size:14px}
#ov h2{font-size:28px;font-weight:400;margin:6px 0 12px}
#ov p{line-height:1.8;margin:0 auto 20px;max-width:34ch;word-break:keep-all}
.lg{padding:7px 0;border-bottom:1px solid #fff2;font-size:15px;line-height:1.6}.lg b{color:var(--pk);margin-right:6px}
.gl{background:#ffffff12;border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.7;font-size:14px}.gl small{color:var(--pk)}
#ov input{font-family:var(--pix);font-size:18px;text-align:center;width:min(260px,80%);margin:6px auto 18px;display:block;padding:10px;background:#ffffff14;color:var(--fg);border:1.5px solid #ffffff55;border-radius:12px}
#ov input:focus{outline:3px solid var(--pk)}
.dj{display:block;width:100%;text-align:left;font-family:var(--pix);background:#ffffff10;color:var(--fg);border:1px solid #fff3;border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;line-height:1.5;font-size:14px}
.dj:hover{border-color:var(--pk)}.dj b{color:var(--pk);margin-right:6px;font-weight:400}.dj small{display:block;color:var(--mist);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--pk);color:#2a1030;padding:6px 16px;border-radius:999px;font-size:14px;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#menu .cv{order:2;margin-bottom:26px}#menu .cv-n{order:1;position:static;margin:0 0 10px;font-size:13px;opacity:1;color:#fff;background:#ffffff1f;border:1px solid #ffffff55;border-radius:999px;padding:4px 14px;letter-spacing:.06em;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}#menu .mw{order:3}
#blang{border-style:solid;margin-top:14px}
</style>

a:{b:'dorm',t:'1. 숙소의 밤',l:[n('새벽 한 시가 가까운 숙소 거실. 연습을 마친 우리는 소파에 늘어져 있다. 나는 유진이 손에 든 과자 봉지만 노려본다.'),h('유진아, 한 입만. 아~'),n('입을 벌린 채 눈만 동그랗게 뜨고 올려다본다. 과자를 집던 유진의 손이 멈춘다.'),y('형, 그렇게 귀엽게 쳐다봐도 안 돼요.'),n('유진이 작게 한숨을 쉰다. 먹고 있던 과자를 다정하게 집어 내 입에 넣어 준다. 손끝이 입술 가장자리를 스치고 지나간다.'),y('…말티즈처럼 먹네.'),n('작게 중얼거리고는 유진이 입꼬리를 슬쩍 올린다. 놀리는 말인데 목소리가 이상하게 다정하다.'),h('말티즈? 나 지금 강아지 취급당한 거야?'),y('그래도 깨무는 건 안 돼요.'),n('말끝에 유진이 장난스럽게 웃는다. 그 얼굴을 보고 있자니 나도 모르게 따라 웃게 된다.'),m('이런 사소한 게 좋아서 매일 모른 척 장난을 친다. 좋아한다는 말은 장난에도 못 섞으면서.')],

c:[['“나도 유진이랑 같은 마음인 것 같아.”',{o:2},[h('나도 유진이랑 같은 마음인 것 같아.'),n('괜한 부끄러움에 애써 감춰 왔던 마음을 조심스레 내어 보였다. 입 밖으로 꺼내고 나니, 그동안 마음 한편에 쌓여 있던 서운함마저 사르르 녹아내리는 듯했다.'),vo(y('사랑한다고 말해 주세요.'),'v_l3.mp3'),n('사랑을 갈구하는 욕심스러운 말에 조금 놀라 유진을 바라보았다. 가슴 한편이 뜨거워지는 듯했다. 그토록 간절하게 내 사랑을 바라는 모습이 어쩐지 애틋하고 사랑스러웠다.'),vo(y('사랑해라고 해 줘.'),'v_m3.mp3'),n('마치 어린아이처럼 떼를 쓰듯, 반말로 다시 한번 사랑을 요구했다.'),vo(h('사랑해.'),'v_n3.mp3'),n('사랑을 보채는 유진을 바라보며 다정하게 말했다. 그 짧은 한마디에 담긴 마음만큼은 조금도 가볍지 않았다.')],'R'],['“……겁이 나.”',{h:3},[h('……겁이 나.'),n('그토록 듣고 싶었던 말이었다. 그러나 벅찬 기쁨이 자리해야 할 곳에 어둡고 짙은 안개가 내려앉았다.'),m('더 가까워진다는 건, 언젠가 지금보다 더 멀어질 수도 있다는 뜻이니까.'),m('함께한 추억도, 당연하게 나누었던 일상도, 무심히 건네던 사소한 손길마저도 언젠가는 전부 잃게 되면 어떡하지.'),y('저는 겁 하나도 안 나요.'),n('조금의 망설임도 없는 목소리. 그 속에 옅은 소나기가 내린다.'),h('전부 다 너무 헷갈려. 뭐가 맞는지 모르겠어……'),n('이 마음으로 저 사랑을 지켜낼 자신이 없었다.'),n('잠시 나를 응시하던 유진이 이내 몰아세우듯 물었다.'),y('형은 내가 다른 사람 좋아해도 괜찮아요? 다른 사람이랑 만나고, 그 사람한테 사랑한다고 해도?'),m('싫다. 상상하는 것만으로도 가슴이 저릿해질 만큼 싫다.'),m('하지만 사랑했던 기억마저 아픔으로 남게 되면, 그때는 어떡하지.'),m('어느 쪽도 견딜 자신이 없다.'),m('다른 사람을 사랑하는 유진을 바라보는 것도, 사랑했던 유진을 잃는 것도.'),h('……미안해.'),n('떨리는 숨과 함께 내뱉은 대답에 유진은 허탈한 듯 천천히 고개를 떨구었다.'),n('무언가 말하려는 듯하다 이내 입을 다물었다.'),y('……무슨 말인지 알겠어요.'),n('눈물이 터져 버릴 것만 같았다.'),y('추워요. 얼른 들어가서 쉬어요. 그러다 감기 걸려.'),n('이 순간에도 여전히 내게 사랑을 건넨다.'),m('정말 바보 같다.'),m('유진은 무슨 말을 하려 했을까.'),n('벌써부터 후회가 밀려온다.')],'eN'],['“그걸 꼭 말로 들어야 알아?”',{y:1},[h('그걸 꼭 말로 들어야 알아?'),n('유진은 대답 대신 입술을 꾹 깨물었다. 아무래도 내 마음을 직접 확인받고 싶은 모양이다.'),h('그럼 하나씩 천천히 하자. 밥도 먹고, 데이트도 하고, 부모님도 만나고~'),y('이미 다 했잖아요……'),n('못마땅한 듯 중얼거리는 유진의 모습에 슬며시 웃음이 났다.'),h('더 많이 해야지~ 이제부터는 다르게.'),n('어떤 의미인지 알아차린 듯 유진의 귓불이 발갛게 물들었다.'),n('이내 내 어깨에 가만히 이마를 기댔다.'),h('내가 그렇게 좋아?'),y('……네.'),n('긴장이 풀린 듯 안도의 숨과 함께 수줍은 대답이 돌아왔다. 그 솔직한 모습이 퍽 사랑스러웠다.'),m('이미 수없이 함께해 온 일들이지만, 앞으로는 그 모든 순간에 조금 다른 의미가 담기겠지.'),n('유진과 함께할 내일이 조금은 기대되기 시작했다.')],'eG']]},

const TR={"en":{"새벽 한 시가 가까운 숙소 거실. 연습을 마친 우리는 소파에 늘어져 있다. 나는 유진이 손에 든 과자 봉지만 노려본다.":"Nearly 1 a.m., the dorm living room. Done with practice, we're sprawled across the sofa. I'm glaring at the bag of snacks in Yujin's hand.","유진아, 한 입만. 아~":"Yujin, just one bite. Ahh~","입을 벌린 채 눈만 동그랗게 뜨고 올려다본다. 과자를 집던 유진의 손이 멈춘다.":"Mouth open, I look up at him with wide, round eyes. Yujin's hand freezes halfway into the bag.","형, 그렇게 귀엽게 쳐다봐도 안 돼요.":"Hyung, looking at me that cutely won't work.","유진이 작게 한숨을 쉰다. 먹고 있던 과자를 다정하게 집어 내 입에 넣어 준다. 손끝이 입술 가장자리를 스치고 지나간다.":"Yujin lets out a small sigh. He picks up a snack and gently puts it in my mouth. His fingertip brushes the corner of my lips.","…말티즈처럼 먹네.":"…You eat like a Maltese.","작게 중얼거리고는 유진이 입꼬리를 슬쩍 올린다. 놀리는 말인데 목소리가 이상하게 다정하다.":"Yujin mutters it under his breath, the corner of his mouth tugging up. It's teasing, but his voice is strangely tender.","말티즈? 나 지금 강아지 취급당한 거야?":"A Maltese? Are you treating me like a puppy right now?","그래도 깨무는 건 안 돼요.":"Still, no biting.","말끝에 유진이 장난스럽게 웃는다. 그 얼굴을 보고 있자니 나도 모르게 따라 웃게 된다.":"Yujin grins playfully at the end. Looking at that face, I end up smiling along without meaning to.","이런 사소한 게 좋아서 매일 모른 척 장난을 친다. 좋아한다는 말은 장난에도 못 섞으면서.":"I love these little moments, so every day I play dumb and tease him. Even though I can't slip the word \"like\" into a single joke.","유진의 어깨에 기댄다":"Lean on Yujin's shoulder","…무거워요, 형.":"…You're heavy, hyung.","그러면서도 내가 편하도록 어깨를 살짝 낮춰 준다. 귀끝이 조금 빨갛다.":"Even so, he lowers his shoulder a little so I'm comfortable. The tips of his ears are slightly red.","“하나 더~” 다시 아~ 하고 입을 벌린다":"\"One more~\" Open wide again, ahh~","…하나만이에요. 진짜로.":"…Just one. I mean it.","그러면서 또 하나를 집어 내 입에 넣어 준다. 입을 다문 채 우물거리는 나를 보고 유진이 작게 웃는다.":"Then he picks up another and puts it in my mouth. Watching me chew with my mouth shut, Yujin laughs softly.","유진이가 주니까 더 맛있다~":"It tastes better when Yujin feeds me~","유진은 대꾸 없이 새 봉지를 뜯어 내 앞에 놓는다. 투덜대는 말과 행동이 반대다.":"Without a word, Yujin tears open a new bag and sets it in front of me. His grumbling and his actions don't match at all.","“고생했어, 우리 유진이” 머리를 쓰다듬는다":"\"Good work today, our Yujin.\" Pat his head","…갑자기 왜 그래요.":"…Why all of a sudden?","피하지는 않는다. 손바닥 밑에서 유진이가 눈을 한 번 감았다 뜬다.":"He doesn't pull away. Under my palm, Yujin closes his eyes once, then opens them.","좋아한다는 말 대신 오늘도 이것만 했다.":"Instead of saying I like him, this is all I did again today.","다음 날 저녁. 식탁에 마주 앉아 두리안을 까고 있는데, 맞은편 유진의 핸드폰이 짧게 울린다.":"The next evening. Sitting across the table from Yujin, I'm cracking open a durian when his phone buzzes briefly.","화면을 본 유진이 피식 웃는다. 잘 웃지 않는 사람이 소리까지 내서.":"Yujin glances at the screen and chuckles. A guy who rarely laughs, laughing out loud.","아, 민준 형이에요. 어제 같이 본 영화 결말 갖고 또 한마디 하네요.":"Oh, it's {M} hyung. He's going on about the ending of the movie we saw yesterday again.","민준. 배우 김민준. 언제부터 이 이름이 이렇게 자연스럽게 나오기 시작했더라.":"{M}. The actor {MF}. Since when did that name start coming up so naturally?","“둘이 많이 친해졌나 보네.”":"\"You two must've gotten really close.\"","장하오가 작게 웅얼거렸다. 말끝이 입 안에서 흐려졌다.":"Zhang Hao mumbles quietly. The end of his words trails off in his mouth.","네? 방금 뭐라고 하셨어요?":"Huh? What did you just say?","아냐, 혼잣말~":"Nothing, just talking to myself~","민준 형이요? 그냥 연락 자주 하는 형이에요. 시간 되면 같이 봐요.":"{M} hyung? He's just someone I text a lot. Let's all hang out when you're free.","같이 보자는 말이 반가워야 하는데, 이상하게 한 박자 늦게 웃게 된다.":"I should be glad he wants us to hang out, but for some reason my smile comes a beat too late.","“좋겠네, 친한 형 생겨서~” 웃어넘긴다":"\"Lucky you, making a close hyung~\" Laugh it off","형이라기엔… 그냥 편해요. 형이랑 나이도 비슷해서 그런가.":"Less like a hyung… he's just comfortable. Maybe because he's around your age, hyung.","나랑 나이가 비슷한 형. 나랑 비슷해서 편하다는 말이 신경 쓰인다.":"A hyung around my age. The part about him being comfortable because he's like me keeps bothering me.","이미 유진이 옆에는 내가 있는데, 굳이 다른 사람이 필요할까 싶었다.":"Yujin already has me by his side. Does he really need someone else?","말없이 두리안만 깐다":"Keep cracking the durian in silence","유진은 핸드폰을 보며 답장을 친다. 엄지가 빠르다. 나는 괜히 두리안 껍질 틈에 칼끝만 더 깊이 밀어 넣는다.":"Yujin types a reply, eyes on his phone. His thumbs are fast. For no reason, I just push the knife tip deeper into the gap in the durian's husk.","가시 돋친 껍질이 쩍 갈라지는 소리가 유진의 웃음소리에 묻힌다.":"The crack of the spiky husk splitting open is drowned out by Yujin's laughter.","일주일 뒤 오후, 연습실. 휴식 시간에 문이 열리고 커피 트레이를 든 키 큰 남자가 들어온다. 배우 김민준이다.":"A week later, afternoon, the practice room. During the break, the door opens and a tall man walks in carrying a coffee tray. It's the actor {MF}.","안녕하세요! 근처에서 촬영하다가 인사만 드리려고 왔어요. 하오 선배님 맞으시죠?":"Hello! I was filming nearby and just came to say hi. You're Hao sunbaenim, right?","아, 안녕하세요. 커피 감사해요.":"Oh, hello. Thanks for the coffee.","민준은 예의 바르고 사람 좋아 보인다. 그래서 더 곤란하다. 싫어할 구석이 없다.":"{M} seems polite and good-natured. That makes it harder. There's nothing about him to dislike.","곧 유진이 바닥에서 일어나 민준 쪽으로 걸어간다. 서로 어깨를 툭 치고, 내가 모르는 농담에 동시에 웃는다.":"Soon Yujin gets up off the floor and walks over to {M}. They nudge each other's shoulders and laugh at the same time at a joke I don't know.","나한테는 존댓말을 쓰던 유진이가 민준한테는 말을 반쯤 놓는다. 그게 왜 이렇게 눈에 들어올까.":"Yujin, who always speaks formally to me, half drops the formalities with {M}. Why does that catch my eye so much?","둘 사이에 자연스럽게 끼어든다":"Casually slip in between them","무슨 얘기야~ 나도 껴 줘.":"What are you talking about~ Let me in too.","아, 유진이가 선배님이 요리 잘한다고 자랑했어요.":"Oh, Yujin was bragging that you're a great cook, sunbaenim.","…그 얘기까지 하지 마요.":"…Don't tell him that part too.","자랑했다고? 나를? 서운함이 반쯤 녹는다.":"He bragged? About me? Half of the hurt melts away.","멀찍이서 물을 마시며 지켜본다":"Watch from a distance, sipping water","물병을 입에 대고 있지만 삼키지는 않는다. 거울 속에서 둘이 나란히 서 있다.":"I hold the water bottle to my lips but don't swallow. In the mirror, the two of them stand side by side.","둘의 모습이 잘 어울린다. 그게 문제다.":"They look good together. That's the problem.","스태프에게 가서 일부러 바쁜 척한다":"Go to the staff and act busy on purpose","저기, 다음 안무 동선 확인해도 될까요?":"Um, could I check the formation for the next choreography?","필요 없는 확인이다. 등 뒤에서 유진의 웃음소리가 들린다. 돌아보지 않는다.":"A pointless check. Behind me, I can hear Yujin laughing. I don't turn around.","휴식이 끝나 갈 무렵. 벽 쪽에 유진이 앉아 있다.":"Near the end of the break. Yujin is sitting by the wall.","내가 다가가는 사이 민준이 먼저 유진 옆에 털썩 앉는다. 아무 뜻 없이, 그냥 거기가 비어 있어서.":"Before I can get there, {M} plops down next to Yujin first. No particular reason, just because the spot was empty.","잠깐 앉아 있다 가도 되지?":"Mind if I sit for a bit?","네, 그럼요.":"Sure, of course.","가만히 서 있는 나를 보고 유진이 고개를 든다.":"Seeing me standing still, Yujin looks up.","어, 형도 앉을래요?":"Oh, hyung, do you want to sit too?","유진이 움직여 자리를 만든다. 나는 그 자리 앞에 서 있다.":"Yujin shifts over to make room. I stand in front of that spot.","“그럴까?”":"\"Should I?\"","유진이 내 손을 잡아끌어 옆에 앉힌다.":"Yujin pulls me by the hand and sits me down next to him.","형 오늘 손 차가워요.":"Your hands are cold today, hyung.","그 한마디에 겨우 숨이 돌아온다.":"With that one sentence, I can finally breathe again.","“난 괜찮아, 서 있을게~”":"\"I'm fine, I'll stand~\"","왜요? 음… 알겠어요.":"Why? Hmm… okay.","유진이 눈을 맞추지 않고 말한다.":"Yujin says it without meeting my eyes.","그 말투가 평소와 같은지 아닌지 모르겠다. 확인할 용기도 없다.":"I can't tell if his tone is the same as usual or not. I don't have the courage to check either.","혼자 맞은편 벽에 앉는다":"Sit alone by the opposite wall","시선 너머로 두 사람이 보인다. 둘 사이엔 틈이 없다.":"I can see the two of them across the room. There's no gap between them.","내가 자리를 비워 둔 건데, 왜 내가 밀려난 기분일까. 서운함이 조금씩 번져간다.":"I'm the one who left the seat empty, so why do I feel pushed out? The hurt slowly spreads.","그날 저녁 숙소. 유진이 현관 앞에서 운동화 끈을 만지고 있다.":"That evening at the dorm. Yujin is fiddling with his shoelaces by the front door.","형, 저 아는 형이랑 약속 있어서 나가 볼게요. 늦으니까 저녁은 먼저 먹어요.":"Hyung, I've got plans with a hyung I know, so I'm heading out. I'll be late, so go ahead and eat dinner first.","오늘 저녁은 나랑 같이 먹자 했으면서..":"He said we'd have dinner together tonight..","“알겠어… 조심히 다녀와.”":"\"Okay… be careful out there.\"","정말 괜찮아요?":"Are you really okay with it?","괜찮지~ 형은 라면 혼자 먹으면 되지!":"Of course~ Hyung can just eat ramyeon by himself!","유진이 내 얼굴을 한 번 더 보다가 고개를 끄덕인다.":"Yujin looks at my face once more, then nods.","들켰나. 아니, 안 들켰겠지.":"Did he notice? No, he couldn't have.","“오늘 나랑 양꼬치 먹기로 했잖아…” 서운한 티를 조금 낸다":"\"You said we'd get lamb skewers tonight…\" Let a little hurt show","아… 맞다. 죄송해요.":"Ah… right. I'm sorry.","유진이 잠깐 입을 닫았다가 말한다.":"Yujin is quiet for a moment, then speaks.","일찍 올게요. 형이 먹고 싶다는 거 사 올게요.":"I'll come back early. I'll bring whatever you want to eat, hyung.","투정 부렸다 싶어 얼굴이 뜨겁다. 그런데 일찍 오겠다는 말이 이상하게 오래 남는다.":"I feel my face heat up, like I was whining. But his promise to come back early stays with me strangely long.","“저녁은 나랑 먹으면 안 돼?”":"\"Can't you have dinner with me?\"","아… 오늘은 먼저 잡은 약속이라서요. 다음에 같이 먹어요.":"Ah… I made these plans first today. Let's eat together next time.","유진이 대수롭지 않게 대답한다. 그 대수롭지 않음이 더 아프다.":"Yujin answers like it's no big deal. That no-big-deal hurts even more.","유진이 나간 저녁. 숙소가 이렇게 넓었나. 유진이 없으니 TV 소리만 크다.":"The evening after Yujin leaves. Was the dorm always this big? Without Yujin, only the TV is loud.","원래라면 지금쯤 유진이랑 마주 앉아 같이 양꼬치를 먹고 있었을 텐데. 대신 혼자 라면을 끓였다.":"Normally, I'd be sitting across from Yujin eating lamb skewers right about now. Instead, I made ramyeon alone.","혼자 먹는 라면은 맛이 없다. 결국 두 젓가락 먹고 내려놓았다.":"Ramyeon eaten alone has no taste. In the end, I put it down after two bites.","지금쯤 뭐 하고 있을까.":"What is he doing right now?","몇 시간이 흘러 시계는 어느새 새벽 한 시를 넘겼다. 유진은 아직 돌아오지 않았다.":"Hours pass, and before I know it the clock is past 1 a.m. Yujin still isn't back.","통화 목록을 연다. 맨 위에 유진의 이름이 있다. 통화 버튼 위에 엄지를 올렸다가 내린다. 다시 올린다.":"I open my call history. Yujin's name is at the top. I hover my thumb over the call button, then pull it back. Then hover again.","“유진아, 언제 들어와?” 전화를 건다":"\"Yujin, when are you coming home?\" Call him","통화 버튼을 누른다. 연결음이 길게 이어진다.":"I press the call button. The ringback tone drags on.","연결음이 세 번 울리고 유진이 받는다.":"It rings three times, and Yujin picks up.","유진아, 언제 들어와?":"Yujin, when are you coming home?","어… 아직요. 형 아직 안 잤어요?":"Uh… not yet. Hyung, you're still up?","네가 아직 안 와서…":"Because you're not home yet…","얘기가 아직 안 끝나서, 형 먼저 자요. 나중에 연락할게요.":"We're not done talking yet, so go to sleep first, hyung. I'll text you later.","말투는 평소와 같은데 속도가 빠르다. 대답 사이사이 뒤쪽 소리에 귀를 기울이는 것 같다. 내가 무슨 말을 더 하기도 전에 통화가 끊긴다.":"His tone is the same as usual, but he's talking fast. Between answers, he seems to be listening to something behind him. Before I can say anything more, the call ends.","얼른 끊고 싶어 하는 것 같았는데, 내 착각일까. 괜히 전화를 걸어 방해한 것만 같아 기분이 저조해진다.":"It seemed like he wanted to hang up quickly, or am I imagining it? I feel like I called for nothing and just got in the way, and my mood sinks.","몇 분 뒤 메시지가 온다.":"A few minutes later, a message comes in.","금방 들어갈게요":"I'll be home soon","그 한 줄을 세 번 읽는다.":"I read that one line three times.","연락이 됐으니 그걸로 됐다고 말하고 싶은데, 마음이 잘 따라 주지 않는다.":"I want to say that hearing from him is enough, but my heart won't quite follow.","통화 버튼에서 손을 뗀다":"Take your finger off the call button","핸드폰을 엎어 놓는다.":"I turn my phone face down.","방해하는 사람이 되기 싫다. 나이도 더 많은 주제에.":"I don't want to be the one getting in the way. Not when I'm the older one, of all people.","어른스러운 척, 사실은 겁쟁이.":"Pretending to be mature. Really, a coward.","멤버 단톡방에서 아무 이야기나 한다":"Chat about nothing in the members' group chat","단톡방에 의미 없는 사진을 올린다. 멤버들이 웃음 이모티콘을 달아 준다.":"I post a meaningless photo in the group chat. The members react with laughing emojis.","유진의 이름만 대화창 맨 아래에 조용히 남아 있다.":"Only Yujin's name sits quietly at the bottom of the chat.","며칠 뒤 아침, 식탁. 유진이 핸드폰을 보다가 또 웃는다. 나는 숟가락을 든 채 그 얼굴을 본다.":"A few days later, morning, at the table. Yujin looks at his phone and smiles again. Spoon in hand, I watch his face.","평소라면 “뭐 봐? 나도 보여줘~” 하며 어깨를 부딪혔을 거다. 하지만 오늘은 목소리가 나오지 않는다.":"Normally I'd bump his shoulder and go, \"What are you looking at? Show me too~\" But today, my voice won't come out.","…밥 먹자.":"…Let's eat.","네? 아, 네. 형 어제 늦게 잤어요? 피곤해 보이는데.":"Huh? Oh, yeah. Did you sleep late last night, hyung? You look tired.","평소처럼 웃으며 말을 건네는 일이 이렇게 어려운 일이었나.":"Was it always this hard to smile and talk to him like usual?","“왜 얼굴 많이 부었어~?” 라며 억지로 장난을 건다":"\"Why's your face so puffy~?\" Force a joke","…안 부었어요. 살 빠진 것 같은데.":"…It's not puffy. I think I lost weight.","유진이 웃지 않는다. 웃음을 기대했던 내 입꼬리만 어색하게 남는다.":"Yujin doesn't laugh. Only the corners of my mouth, waiting for a laugh, are left hanging awkwardly.","“아직 잠이 덜 깼나 보지.” 방으로 간다":"\"Guess I'm still half asleep.\" Go to your room","방문을 닫고 등을 기댄다. 식탁에서 유진이 의자를 미는 소리가 들린다. 따라오는 발소리는 없다.":"I close the door and lean against it. From the table, I hear Yujin push his chair back. No footsteps follow.","따라와 주길 바란 내가 제일 이상하다.":"I'm the weird one for hoping he'd follow me.","“유진아, 오늘 저녁에 시간 돼?” 용기를 낸다":"\"Yujin, are you free tonight?\" Work up the courage","오늘이요? …네, 돼요.":"Tonight? …Yeah, I'm free.","그럼 같이 밥 먹자. 형이 쏠게.":"Then let's have dinner together. Hyung's treat.","유진이 핸드폰을 내려놓고 나를 똑바로 본다. 그제야 내가 이 시선을 얼마나 기다렸는지 안다.":"Yujin puts his phone down and looks straight at me. Only then do I realize how long I'd been waiting for that gaze.","며칠이 지난다. 각자 스케줄이 많아 숙소에서 얼굴 볼 일이 줄었다.":"A few days pass. With our packed schedules, we rarely see each other at the dorm.","메시지 창을 연다. 위로 올려 봐도 대화의 시작은 늘 내 말풍선이다.":"I open our chat. No matter how far up I scroll, the conversation always starts with my bubble.","유진아 밥은 먹었어?":"Yujin did you eat","오늘 촬영장 춥던데 따뜻하게 입어":"it was cold at the shoot today dress warm","숫자 1이 사라지고, 답장은 금방 온다.":"The 1 disappears, and the reply comes quickly.","네 먹었어요":"yes I ate","형도 꼭 챙겨 먹어요":"make sure you eat too hyung","다정한 답장. 거기서 끝이다.":"A sweet reply. And that's where it ends.","대화를 이어 가는 건 이번에도 내 몫이다.":"Keeping the conversation going is my job again.","“오늘 끝나고 뭐 해?” 한 번 더 보낸다":"\"What are you doing after today?\" Send one more","오늘 끝나고 뭐 해?":"what are you doing after today?","1은 금방 사라진다. 답은 한참 뒤에 온다.":"The 1 vanishes quickly. The reply comes much later.","피곤해서 숙소 가서 쉬려고요":"I'm tired so I'm going back to the dorm to rest","그럼 저 이제 촬영 들어갈게요":"I'm heading into the shoot now","응 열심히 해":"ok good luck","“응 알겠어”라고 답장한다":"Reply \"ok got it\"","응 알겠어":"ok got it","1이 사라진다. 그걸로 끝이다.":"The 1 disappears. That's the end of it.","알겠다고 보낸 건 나인데, 뭘 더 기다리는 걸까. 알면서도 화면을 몇 번 더 켜 본다.":"I'm the one who said okay, so what am I still waiting for? I know, and yet I turn the screen on a few more times.","쓰던 메시지를 지운다":"Delete the message you were writing","‘요즘 나한테 서운한 거 있어?’ 썼다가 한 글자씩 지운다.":"I type \"Are you upset with me lately?\" and then delete it one letter at a time.","일곱 살이나 많은 형이 할 말은 아니다.":"Not something a hyung seven years older should say.","밤 열두 시가 넘었다. 유진은 아직 숙소에 들어오지 않았다.":"It's past midnight. Yujin still hasn't come back to the dorm.","내가 너무 예민하게 구는 걸 수도 있다. 유진이 바쁘다는 건 누구보다 잘 알고 있으니까.":"Maybe I'm being too sensitive. I know better than anyone how busy Yujin is.","그런데도 자꾸 서운한 마음이 드는 건 어쩔 수 없었다.":"Even so, I can't help feeling hurt again and again.","좋아하는 사람에게 나만 계속 다가가는 건, 생각보다 외로운 일이니까.":"Because being the only one who keeps reaching out to the person you like is lonelier than you'd think.","결국 메시지 창을 연다.":"In the end, I open the chat.","언제 들어와?":"when are you coming home?","1이 그대로 떠 있다. 1분, 2분.":"The 1 stays there. One minute, two minutes.","…1이 사라진다.":"…The 1 disappears.","조금 늦을 것 같아요":"I think I'll be a bit late","왜요?":"why?","지금 스케줄 끝난 거 아니야?":"isn't your schedule over already?","민준이 형 좀 만나고 갈게요":"I'm going to see {M} hyung for a bit before I come","심장이 덜컥 내려앉았다. 발밑이 한순간 꺼져 버린 것만 같았다.":"My heart drops. It feels like the floor just gave way under my feet.","그래":"fine","너 마음대로 해":"do whatever you want","보내 놓고 보니 말끝이 뾰족하다. 지울까 하다가 그냥 둔다.":"After sending it, I realize how sharp it sounds. I think about deleting it, then leave it.","형":"hyung","하고 싶은 말이 있으면 해요":"if you have something to say just say it","들켰다. 아니, 들키고 싶었던 걸지도 모른다.":"He noticed. No, maybe I wanted him to notice.","요즘 집에 너무 늦게 오는 거 같아":"you've been coming home so late lately","바빠서 그래요":"it's because I'm busy","형도 알잖아요":"you know that hyung","바쁜 거 안다. 그런데 이해하려고 애쓸수록 오히려 서운함이 더 커지는 것 같다.":"I know he's busy. But the harder I try to understand, the bigger the hurt seems to get.","알아":"I know","근데 왜 요즘 나랑은 안 놀아?":"but why don't you hang out with me lately?","1이 사라진다. 입력 중 표시가 떴다가 사라지고, 다시 뜬다.":"The 1 disappears. The typing indicator appears, disappears, and appears again.","제가요?":"me?","그런 거 아닌 거 알잖아요":"you know it's not like that","마침표 하나 없는 짧은 답장.":"A short reply without a single period.","그 한 줄을 보는 순간, 가슴 밑에서 뭔가 확 치민다.":"The moment I see that line, something surges up from deep in my chest.","그걸 내가 어떻게 알아. 내 마음도 모르겠는데.":"How would I know that? I don't even know my own heart.","손이 떨린다. 생각보다 손가락이 먼저 움직인다.":"My hands are shaking. My fingers move before I can think.","참지 않고 통화 버튼을 누른다":"Press the call button without holding back","“그래 됐다”까지 치다가, 지우고 전화를 건다":"Type \"fine, forget it,\" delete it, and call him","‘그래 됐다’까지 치다가 한 글자씩 지운다. 이렇게 끝낼 수는 없다.":"I type \"fine, forget it\" and then delete it one letter at a time. I can't end it like this.","메시지 창을 닫고 통화 버튼을 세게 누른다.":"I close the chat and jab the call button.","연결음이 한 번 다 울리기도 전에 끊기듯 넘어간다.":"Before the first ring even finishes, it connects like it's been cut off.","여보세요, 소리도 없다. 수화기 너머로 숨소리만 들린다. 그걸 듣자마자 참고 있던 게 터진다.":"No \"hello.\" Only breathing on the other end. The moment I hear it, everything I've been holding back bursts out.","너 나 신경 하나도 안 써?":"Do you not care about me at all?","형을 어떻게 신경을 안 써요.":"How could I not care about you, hyung?","근데 자꾸 나를 피하잖아.":"Then why do you keep avoiding me?","생각이 너무 많았어요 그냥.":"I just had too much on my mind.","무슨 생각? 나한텐 말 못 해?":"On your mind about what? You can't tell me?","나중에… 나중에 다 말해 줄게요.":"Later… I'll tell you everything later.","너무 답답해.":"It's so frustrating.","불안하니까.":"Because I'm anxious.","목이 멘다. 숨을 한 번 고르고 나서야 다음 말이 나온다.":"My throat tightens. Only after catching my breath does the next sentence come out.","나 항상 불안해하고 있단 말이야.":"I'm always anxious, you know.","말해 놓고 나서야 목소리가 떨렸다는 걸 안다. 핸드폰을 쥔 손에 땀이 찬다.":"Only after saying it do I realize my voice was shaking. My hand gripping the phone is sweaty.","침묵. 끊긴 줄 알고 화면을 내려다볼 즈음, 길게 내쉬는 숨소리가 들린다.":"Silence. Just as I look down at the screen, thinking the call dropped, I hear a long exhale.","(한숨) 하… 내가 더 불안한데.":"(sigh) Ha… I'm the one who's more anxious.","순간 아차 싶었다. 순간의 감정에 휩쓸려 미처 다스리지 못한 감정의 끝이 애꿎은 유진을 향했던 것 같다.":"In that moment, I realize my mistake. Swept up in the moment, I let my unchecked feelings land on Yujin, who did nothing wrong.","목구멍 끝까지 뜨거운 것이 차오른다. 애써 눌러 왔던 감정이 한순간에 역류했다.":"Something hot rises all the way up my throat. The feelings I worked so hard to push down surge back in an instant.","입술을 깨물어도 소용없다. 떨리는 숨이 수화기 너머로 그대로 새어 나간다.":"Biting my lip doesn't help. My shaky breathing leaks right through the phone.","내가 성숙하지 않아서 너무 미안해.":"I'm so sorry I'm not more mature.","미안. 그냥 잊어 줘.":"Sorry. Just forget it.","유진이 대답하기도 전에 통화 종료 버튼을 누른다.":"Before Yujin can answer, I press the end call button.","고개를 들어 보니 내 방 벽에 걸린 유진의 후드가 보인다. 내가 자주 빌려 입던 그 후드다.":"When I look up, I see Yujin's hoodie hanging on my wall. The one I always borrow.","나도 모르게 그걸 내려 입는다. 소매가 손등을 덮는다. 유진의 옷에서 내가 좋아하는 섬유유연제 향이 난다.":"Before I know it, I take it down and put it on. The sleeves cover the backs of my hands. Yujin's clothes smell like the fabric softener I love.","나는 유진이보다 일곱 살이나 많은 형인데, 왜 이렇게 서운하지.":"I'm a hyung seven years older than Yujin, so why does this hurt so much?","후드를 뒤집어쓰고 침대 위에 웅크려 앉는다.":"I pull the hood over my head and curl up on the bed.","무릎 사이에 얼굴을 묻자 참아 왔던 눈물이 뚝뚝 떨어진다. 소매 끝이 점점 축축해지고, 내 눈물에 유진의 냄새가 섞인다.":"The moment I bury my face between my knees, the tears I've been holding back fall drop by drop. The ends of the sleeves grow damp, and Yujin's scent mixes into my tears.","소리가 밖으로 새지 않게 무릎에 얼굴을 더 깊숙이 묻는다.":"I bury my face deeper into my knees so no sound escapes.","좋아한다는 말도 못 하면서 서운해할 자격이나 있겠어. 이 정도만 하자, 이 정도만. 다시 감정을 꾹꾹 눌러 보지만, 그게 잘 안 된다.":"I can't even tell him I like him, so what right do I have to feel hurt? Just this much, only this much. I try to press my feelings down again, but it doesn't work.","현관 비밀번호 소리. 예정보다 훨씬 일찍 유진이가 숙소에 왔다. 현관문이 닫히는 소리가 들리기도 전에, 다급한 유진의 발소리가 들린다.":"The beep of the front door lock. Yujin is back at the dorm much earlier than planned. Before I even hear the door close, I hear his hurried footsteps.","노크도 없이 방문이 열린다. 문 앞에 유진이 서 있다. 손에는 편의점 봉지가 들려 있다. 그 안에 내가 먹고 싶다고 했던 젤리가 보인다.":"My door opens without a knock. Yujin is standing in the doorway, holding a convenience store bag. Inside, I can see the jelly I said I wanted.","유진이 아무 말 없이 한 걸음 들어온다. 나는 얼굴을 돌렸지만 이미 늦었다.":"Yujin steps in without a word. I turn my face away, but it's too late.","유진의 시선이 내가 입고 있는 자기 후드에 잠시 머물다가, 눈물에 젖은 소매 끝으로 천천히 옮겨 간다.":"Yujin's eyes rest for a moment on his own hoodie I'm wearing, then slowly move to the tear-soaked ends of the sleeves.","벗을 틈이 없었다. 변명할 틈도.":"There was no time to take it off. No time for excuses either.","“형이 왜 미안해요.” 유진이 속상한 얼굴로 묻는다":"\"Why are you the one apologizing, hyung?\" Yujin asks, looking hurt","형이 왜 미안해요.":"Why are you the one apologizing, hyung?","유진이 침대 앞에 무릎을 꿇고 앉아 내 얼굴을 올려다본다.":"Yujin kneels in front of the bed and looks up at my face.","그렇게 끊어 버리면 제가 어떻게 잊어요.":"How am I supposed to forget when you hang up like that?","나도 모르게 내뱉은 말이었는데, 그 말을 붙잡고 여기까지 달려올 줄은 몰랐다.":"I blurted it out without thinking, and I never imagined he'd hold onto those words and run all the way here.","유진이 말없이 눈물을 닦아 준다":"Yujin silently wipes away the tears","유진이 말없이 손을 뻗어 내 눈가의 눈물을 닦아 준다.":"Without a word, Yujin reaches out and wipes the tears from the corners of my eyes.","손끝이 차갑다. 밖에서부터 뛰어온 사람의 손이다.":"His fingertips are cold. The hands of someone who ran here from outside.","밀어내야 하는데, 나도 모르게 그 손에 얼굴을 기대고 만다.":"I should push him away, but before I know it, I lean my face into his hand.","…울지 마요, 형.":"…Don't cry, hyung.","“왜 벌써 왔어..?” 하오가 눈물을 감추며 묻는다":"\"Why are you back already..?\" Hao asks, hiding his tears","왜 벌써 왔어..?":"Why are you back already..?","아니야… 그냥 나 안아 줘..":"Never mind… just hold me..","유진이 대답 대신 봉지를 내려놓고 나를 끌어안는다.":"Instead of answering, Yujin puts the bag down and pulls me into a hug.","맞닿은 가슴 너머로 유진의 심장 소리가 들린다. 쿵, 쿵, 쿵. 숨이 찰 만큼 빠르다.":"Through our chests pressed together, I hear Yujin's heartbeat. Thump, thump, thump. So fast he's out of breath.","…여기까지 뛰어왔구나. 나 때문에.":"…He ran all the way here. Because of me.","제가 미안해요.":"I'm the one who's sorry.","저는 자꾸 형만 신경 쓰여서… 혹시 형이 그걸 부담스러워할까 봐, 그게 무서웠어요.":"I kept caring only about you, hyung… and I was scared you might find that a burden.","나만 불안한 줄 알았다. 유진이도 나만큼, 어쩌면 나보다 더 흔들리고 있었다. 이번엔 나도 말해야 한다.":"I thought I was the only anxious one. Yujin was shaken just as much as me, maybe even more. This time, I have to say it too.","부담 안 가져. 나는… 유진이가 나를 더 신경 써 줬으면 좋겠어.":"It's not a burden. I… I want you to care about me more, Yujin.","사실 알고 있었다. 유진이는 늘 나를 지켜보고, 내가 조금만 달라져도 먼저 알아채고 안아 주던 애라는 걸.":"Honestly, I already knew. Yujin is the one who always watches over me, who notices first and holds me the moment I change even a little.","형이 조금이라도 달라지면 누구보다 제가 먼저 알아요.":"If you change even a little, hyung, I'm the first to know. Before anyone.","다음 날 아침. 눈이 퉁퉁 부어 있다. 식탁에 유진이 있다. 내 자리 앞에 따뜻한 물과 아이스팩이 놓여 있다.":"The next morning. My eyes are swollen. Yujin is at the table. In front of my seat are a glass of warm water and an ice pack.","눈 부었어요. 이거 대고 있어요. 스케줄 오후부터니까 더 자도 돼요.":"Your eyes are swollen. Hold this on them. Your schedule starts in the afternoon, so you can sleep more.","유진의 핸드폰이 울린다. 화면에 민준 이름이 뜬다. 유진은 핸드폰을 뒤집어 놓는다.":"Yujin's phone rings. {M}'s name flashes on the screen. Yujin turns the phone face down.","김민준 형 연락이에요. 지금은 안 받을래요.":"It's {MF} hyung. I won't answer right now.","안 받는다. 나 때문에.":"He's not answering. Because of me.","“지금은 내가 더 중요한 거야?”":"\"So right now, I'm more important?\"","지금은 내가 더 중요한 거야?":"So right now, I'm more important?","지금만 그런 거 아닌데요.":"It's not just right now.","유치하지만 한 번 더 확인하고 싶어졌다.":"It's childish, but I want to check one more time.","앞으로 나랑 다른 사람 중에 골라야 한다면?":"What if someday you had to choose between me and someone else?","제 선택은 항상 형이죠.":"I'd always choose you, hyung.","조금의 망설임도 없는 대답이었다.":"An answer without the slightest hesitation.","유진은 내 손에 들린 아이스팩을 가져가 부어오른 눈 위에 조심스레 얹어 주었다.":"Yujin takes the ice pack from my hand and carefully places it over my swollen eyes.","차가운 감촉 너머로 유진의 다정함이 고스란히 전해졌다.":"Beyond the cold touch, Yujin's tenderness comes through completely.","“유진이가 해 줘.”":"\"You do it, Yujin.\"","아이스팩을 내밀자 유진이 잠깐 나를 본다. 그러다 핸드폰을 내려놓고 아이스팩을 받아 든다.":"When I hold out the ice pack, Yujin looks at me for a moment. Then he puts his phone down and takes it.","이리 와요. 눈 감고 있어요.":"Come here. Close your eyes.","차가운 아이스팩이 눈가에 닿는다. 그걸 대 주는 유진의 손이 이상하게 따뜻하다.":"The cold ice pack touches the corners of my eyes. Yujin's hand holding it there is strangely warm.","“차가워. 나 이거 안 할래..”":"\"It's cold. I don't wanna do this..\"","차가워. 나 이거 안 할래..":"It's cold. I don't wanna do this..","안 돼요. 방송 전에 가라앉혀야 해요.":"No. We have to get the swelling down before the broadcast.","유진이 의자를 끌어와 내 옆에 앉는다. 아이스팩을 수건으로 한 번 감싸더니 내 눈가에 살며시 대 준다.":"Yujin pulls a chair over and sits next to me. He wraps the ice pack in a towel and gently holds it to my eyes.","이러면 덜 차갑죠?":"Less cold this way, right?","투정 한 번에 이렇게 가까워질 줄은 몰랐다.":"I never thought one bit of whining would bring us this close.","스케줄이 모두 끝난 밤, 숙소 베란다. 유진이 문을 닫고 내 앞에 선다. 평소처럼 담담한 얼굴인데 눈이 곧다.":"Night, after every schedule is over. The dorm balcony. Yujin closes the door and stands in front of me. His face is calm as always, but his eyes are steady.","추운데 왜 나와 있어요.":"Why are you out here when it's cold?","유진이 들고 온 겉옷을 내 어깨 위에 조심스레 둘러 주었다.":"Yujin carefully drapes the jacket he brought over my shoulders.","고마워.":"Thanks.","어깨를 감싼 옷자락 사이로 희미한 온기가 스며들었다. 이상하게도 마음까지 따뜻해지는 기분이었다.":"A faint warmth seeps in through the fabric wrapped around my shoulders. Strangely, it feels like it's warming my heart too.","저 이런 거 형한테만 해요.":"I only do this kind of thing for you, hyung.","뜻밖의 말에 아무런 대답도 하지 못했다. 그저 유진의 얼굴만 멍하니 바라보았다.":"I can't say anything to the unexpected words. I just stare blankly at Yujin's face.","제가 나중에 다 얘기해 준다고 했던 거, 기억해요?":"Remember when I said I'd tell you everything later?","기억난다. 엉엉 울던 모습을 유진에게 들켜 버린 그날.":"I remember. The day Yujin caught me sobbing my heart out.","부끄러운 기억이 선명하게 떠올라, 말없이 고개만 끄덕였다.":"The embarrassing memory comes back vividly, and I just nod without a word.","그날, 민준 형한테 고민 상담하러 갔던 거예요.":"That day, I went to {M} hyung for advice.","또다시 민준의 이름이었다. 그 이름을 듣는 순간, 마음 한구석에 작은 정전기가 이는 듯했다.":"{M}'s name again. The moment I hear it, it feels like a tiny spark of static crackles in a corner of my heart.","형을 좋아하는데 어떻게 해야 될지 모르겠어서.":"Because I like a hyung and I didn't know what to do.","생각지도 못한 말에 고개를 번쩍 들었다. 유진은 잠시 나와 눈을 맞추더니, 이내 시선을 아래로 떨구었다.":"At the unexpected words, my head snaps up. Yujin meets my eyes for a moment, then drops his gaze.","…어떤 형?":"…Which hyung?","유진이 당황한 듯 귀끝까지 빨개지더니, 말없이 손가락으로 나를 가리켰다.":"Yujin turns red all the way to the tips of his ears, flustered, and silently points at me.","“…유진아, 너 나 좋아해?”":"\"…Yujin, do you like me?\"","…유진아, 너 나 좋아해?":"…Yujin, do you like me?","유진이 눈을 피하지 않고 고개를 끄덕인다.":"Yujin nods without looking away.","네. 좋아해요, 형.":"Yes. I like you, hyung.","…나만 그런 게 아니었구나.":"…So it wasn't just me.","“나도 유진이 좋아하지…”":"\"Of course I like you too, Yujin…\"","나도 유진이 좋아하지…":"Of course I like you too, Yujin…","유진이 한 걸음 다가와 내 어깨를 잡으며 말했다.":"Yujin steps closer and takes hold of my shoulders as he speaks.","형이 나한테만 잘해 줬으면 좋겠고, 나한테만 웃어 줬으면 좋겠고, 형이 제일 먼저 찾는 사람도 나였으면 좋겠어요.":"I want you to be good only to me, smile only at me, and I want to be the first person you look for.","뭐라고 말해야 할지 몰라 아무 말도 하지 못했다.":"I don't know what to say, so I say nothing at all.","대답을 못 하고 시선을 피한다":"Look away without answering","도망가도 되는데, 오늘은 그냥 듣고 있어요.":"You can run away, but just listen today.","유진의 목소리가 낮다. 도망칠 곳은 사실 없다.":"Yujin's voice is low. There's nowhere to run anyway.","나 말고 다른 사람이랑 더 친해지는 것도 싫고, 형이 다른 사람한테 나한테 하듯이 다정하게 구는 것도 싫어요.":"I don't want you getting closer to anyone but me, and I don't want you being sweet to anyone else the way you are with me.","당황스러운 마음을 추스를 새도 없이 유진의 말이 이어졌다.":"Before I can pull myself together, Yujin's words keep coming.","그냥 형이 나만 봤으면 좋겠어요. 나만 생각하고, 나만 보고 싶어 하고, 힘들 때도 나한테만 기대고……":"I just want you to look only at me. Think only of me, miss only me, lean only on me when things are hard……","한마디도 보태지 못한 채 그저 유진을 바라보았다. 귓가에 열이 오르는 것이 느껴졌다.":"Without adding a single word, I just look at Yujin. I can feel the heat rising to my ears.","……형도 그래요?":"……Do you feel the same, hyung?","쉴 새 없이 이어지던 고백이 멎었다. 대답을 기다리는 유진의 눈빛에는 간절함이 가득 담겨 있었다.":"The confession that had been pouring out stops. Yujin's eyes, waiting for my answer, are full of longing.","“나도 유진이랑 같은 마음인 것 같아.”":"\"I think I feel the same way as you, Yujin.\"","나도 유진이랑 같은 마음인 것 같아.":"I think I feel the same way as you, Yujin.","괜한 부끄러움에 애써 감춰 왔던 마음을 조심스레 내어 보였다. 입 밖으로 꺼내고 나니, 그동안 마음 한편에 쌓여 있던 서운함마저 사르르 녹아내리는 듯했다.":"I carefully reveal the feelings I'd hidden out of needless embarrassment. Once they're out, even the hurt piled up in a corner of my heart seems to melt away.","사랑한다고 말해 주세요.":"Please tell me you love me.","사랑을 갈구하는 욕심스러운 말에 조금 놀라 유진을 바라보았다. 가슴 한편이 뜨거워지는 듯했다. 그토록 간절하게 내 사랑을 바라는 모습이 어쩐지 애틋하고 사랑스러웠다.":"A little startled by the greedy plea for love, I look at Yujin. My chest burns. The way he longs so desperately for my love is somehow heartbreaking and lovely.","사랑해라고 해 줘.":"Say \"I love you.\"","마치 어린아이처럼 떼를 쓰듯, 반말로 다시 한번 사랑을 요구했다.":"Like a child throwing a tantrum, he demands love once more, this time dropping the formalities.","사랑해.":"I love you.","사랑을 보채는 유진을 바라보며 다정하게 말했다. 그 짧은 한마디에 담긴 마음만큼은 조금도 가볍지 않았다.":"I say it tenderly, looking at Yujin begging for love. Short as it is, the feeling in those words is anything but light.","“……겁이 나.”":"\"……I'm scared.\"","……겁이 나.":"……I'm scared.","그토록 듣고 싶었던 말이었다. 그러나 벅찬 기쁨이 자리해야 할 곳에 어둡고 짙은 안개가 내려앉았다.":"Those were the words I'd longed to hear. But where overwhelming joy should be, a thick, dark fog settles in.","더 가까워진다는 건, 언젠가 지금보다 더 멀어질 수도 있다는 뜻이니까.":"Because getting closer means that someday we could end up even farther apart than now.","함께한 추억도, 당연하게 나누었던 일상도, 무심히 건네던 사소한 손길마저도 언젠가는 전부 잃게 되면 어떡하지.":"What if someday I lose it all? The memories we made, the everyday life we shared so naturally, even the little touches we gave without thinking.","저는 겁 하나도 안 나요.":"I'm not scared at all.","조금의 망설임도 없는 목소리. 그 속에 옅은 소나기가 내린다.":"A voice without the slightest hesitation. Inside it, a light rain is falling.","전부 다 너무 헷갈려. 뭐가 맞는지 모르겠어……":"Everything's so confusing. I don't know what's right……","이 마음으로 저 사랑을 지켜낼 자신이 없었다.":"I wasn't sure I could protect that love with a heart like mine.","잠시 나를 응시하던 유진이 이내 몰아세우듯 물었다.":"Yujin stares at me for a moment, then presses me.","형은 내가 다른 사람 좋아해도 괜찮아요? 다른 사람이랑 만나고, 그 사람한테 사랑한다고 해도?":"Would you be okay if I liked someone else, hyung? If I dated someone else and told them I love them?","싫다. 상상하는 것만으로도 가슴이 저릿해질 만큼 싫다.":"No. Just imagining it makes my chest ache. I hate it.","하지만 사랑했던 기억마저 아픔으로 남게 되면, 그때는 어떡하지.":"But if even the memories of loving him turn into pain, what then?","어느 쪽도 견딜 자신이 없다.":"I don't think I could bear either one.","다른 사람을 사랑하는 유진을 바라보는 것도, 사랑했던 유진을 잃는 것도.":"Watching Yujin love someone else, or losing the Yujin I once loved.","……미안해.":"……I'm sorry.","떨리는 숨과 함께 내뱉은 대답에 유진은 허탈한 듯 천천히 고개를 떨구었다.":"At the answer I let out with a trembling breath, Yujin slowly hangs his head, deflated.","무언가 말하려는 듯하다 이내 입을 다물었다.":"He seems about to say something, then closes his mouth.","……무슨 말인지 알겠어요.":"……I understand what you mean.","눈물이 터져 버릴 것만 같았다.":"I feel like I might burst into tears.","추워요. 얼른 들어가서 쉬어요. 그러다 감기 걸려.":"It's cold. Go inside and rest. You'll catch a cold.","이 순간에도 여전히 내게 사랑을 건넨다.":"Even in this moment, he's still giving me love.","정말 바보 같다.":"I'm such an idiot.","유진은 무슨 말을 하려 했을까.":"What was Yujin about to say?","벌써부터 후회가 밀려온다.":"The regret is already washing over me.","“그걸 꼭 말로 들어야 알아?”":"\"Do you really need to  입만. 아~":"维辰，就一口。啊～","입을 벌린 채 눈만 동그랗게 뜨고 올려다본다. 과자를 집던 유진의 손이 멈춘다.":"我张着嘴，睁圆了眼睛抬头看他。正要拿零食的维辰，手停住了。","형, 그렇게 귀엽게 쳐다봐도 안 돼요.":"哥，你这样可爱地看着我也没用。","유진이 작게 한숨을 쉰다. 먹고 있던 과자를 다정하게 집어 내 입에 넣어 준다. 손끝이 입술 가장자리를 스치고 지나간다.":"维辰轻轻叹了口气，温柔地捏起正在吃的零食，放进我嘴里。指尖擦过我的嘴角。","…말티즈처럼 먹네.":"…吃得跟马尔济斯一样。","작게 중얼거리고는 유진이 입꼬리를 슬쩍 올린다. 놀리는 말인데 목소리가 이상하게 다정하다.":"维辰小声嘀咕着，嘴角悄悄上扬。明明是在调侃，声音却温柔得奇怪。","말티즈? 나 지금 강아지 취급당한 거야?":"马尔济斯？我现在是被当成小狗了吗？","그래도 깨무는 건 안 돼요.":"但是不可以咬人哦。","말끝에 유진이 장난스럽게 웃는다. 그 얼굴을 보고 있자니 나도 모르게 따라 웃게 된다.":"说完，维辰调皮地笑了。看着那张脸，我也不自觉地跟着笑了。","이런 사소한 게 좋아서 매일 모른 척 장난을 친다. 좋아한다는 말은 장난에도 못 섞으면서.":"因为喜欢这些小事，我每天都装傻跟他打闹。明明连「喜欢」两个字都不敢混进玩笑里。","유진의 어깨에 기댄다":"靠在维辰的肩膀上","…무거워요, 형.":"…很重耶，哥。","그러면서도 내가 편하도록 어깨를 살짝 낮춰 준다. 귀끝이 조금 빨갛다.":"嘴上这么说，却还是把肩膀稍微放低，让我靠得舒服一点。耳尖微微泛红。","“하나 더~” 다시 아~ 하고 입을 벌린다":"「再一个～」又张开嘴说啊～","…하나만이에요. 진짜로.":"…只有一个哦。真的。","그러면서 또 하나를 집어 내 입에 넣어 준다. 입을 다문 채 우물거리는 나를 보고 유진이 작게 웃는다.":"说完又拿起一个放进我嘴里。看着闭着嘴嚼个不停的我，维辰轻轻笑了。","유진이가 주니까 더 맛있다~":"维辰喂的比较好吃～","유진은 대꾸 없이 새 봉지를 뜯어 내 앞에 놓는다. 투덜대는 말과 행동이 반대다.":"维辰没有回话，撕开一包新的放在我面前。嘴上嘀咕和行动完全相反。","“고생했어, 우리 유진이” 머리를 쓰다듬는다":"「辛苦了，我们维辰」摸摸他的头","…갑자기 왜 그래요.":"…怎么突然这样。","피하지는 않는다. 손바닥 밑에서 유진이가 눈을 한 번 감았다 뜬다.":"他没有躲开。在我的掌心下，维辰闭上眼睛，又睁开。","좋아한다는 말 대신 오늘도 이것만 했다.":"今天也一样，只做了这些，代替说喜欢。","다음 날 저녁. 식탁에 마주 앉아 두리안을 까고 있는데, 맞은편 유진의 핸드폰이 짧게 울린다.":"隔天晚上。我们面对面坐在餐桌前，我正在剥榴莲，对面维辰的手机短短响了一声。","화면을 본 유진이 피식 웃는다. 잘 웃지 않는 사람이 소리까지 내서.":"看了屏幕的维辰噗哧一笑。一个不太常笑的人，居然还笑出了声。","아, 민준 형이에요. 어제 같이 본 영화 결말 갖고 또 한마디 하네요.":"啊，是{M}哥。他又在对昨天一起看的电影结局发表意见了。","민준. 배우 김민준. 언제부터 이 이름이 이렇게 자연스럽게 나오기 시작했더라.":"{M}。演员{MF}。这个名字是从什么时候开始，这么自然地出现的呢。","“둘이 많이 친해졌나 보네.”":"「你们两个好像变得很熟了嘛。」","장하오가 작게 웅얼거렸다. 말끝이 입 안에서 흐려졌다.":"章昊小声嘟囔着，话尾在嘴里含糊不清。","네? 방금 뭐라고 하셨어요?":"嗯？你刚刚说什么？","아냐, 혼잣말~":"没有啦，自言自语～","민준 형이요? 그냥 연락 자주 하는 형이에요. 시간 되면 같이 봐요.":"{M}哥吗？就只是常联络的哥哥而已。有时间的话一起见面吧。","같이 보자는 말이 반가워야 하는데, 이상하게 한 박자 늦게 웃게 된다.":"说要一起见面明明应该开心，却不知为何慢了一拍才笑出来。","“좋겠네, 친한 형 생겨서~” 웃어넘긴다":"「真好，交到要好的哥哥了～」一笑带过","형이라기엔… 그냥 편해요. 형이랑 나이도 비슷해서 그런가.":"说是哥哥嘛…就是很自在。可能是因为跟哥年纪差不多吧。","나랑 나이가 비슷한 형. 나랑 비슷해서 편하다는 말이 신경 쓰인다.":"跟我年纪差不多的哥哥。因为跟我很像所以很自在，这句话一直让我很在意。","이미 유진이 옆에는 내가 있는데, 굳이 다른 사람이 필요할까 싶었다.":"维辰身边明明已经有我了，真的还需要别人吗？","말없이 두리안만 깐다":"默默继续剥榴莲","유진은 핸드폰을 보며 답장을 친다. 엄지가 빠르다. 나는 괜히 두리안 껍질 틈에 칼끝만 더 깊이 밀어 넣는다.":"维辰看着手机回消息，拇指动得飞快。我只是莫名其妙地把刀尖往榴莲壳的缝隙里推得更深。","가시 돋친 껍질이 쩍 갈라지는 소리가 유진의 웃음소리에 묻힌다.":"长满尖刺的外壳啪地裂开的声音，被维辰的笑声掩盖了。","일주일 뒤 오후, 연습실. 휴식 시간에 문이 열리고 커피 트레이를 든 키 큰 남자가 들어온다. 배우 김민준이다.":"一周后的下午，练习室。休息时间门打开了，一个拿着咖啡托盘的高个子男人走了进来。是演员{MF}。","안녕하세요! 근처에서 촬영하다가 인사만 드리려고 왔어요. 하오 선배님 맞으시죠?":"大家好！我在附近拍摄，顺路来打个招呼。您是章昊前辈对吧？","아, 안녕하세요. 커피 감사해요.":"啊，你好。谢谢你的咖啡。","민준은 예의 바르고 사람 좋아 보인다. 그래서 더 곤란하다. 싫어할 구석이 없다.":"{M}看起来很有礼貌，人也很好。所以才更麻烦。根本找不到讨厌他的地方。","곧 유진이 바닥에서 일어나 민준 쪽으로 걸어간다. 서로 어깨를 툭 치고, 내가 모르는 농담에 동시에 웃는다.":"不久，维辰从地上站起来朝{M}走去。他们互相拍了拍肩膀，因为我不知道的玩笑同时笑了起来。","나한테는 존댓말을 쓰던 유진이가 민준한테는 말을 반쯤 놓는다. 그게 왜 이렇게 눈에 들어올까.":"对我总是说敬语的维辰，对{M}却说话半放松。为什么这一点这么刺眼呢。","둘 사이에 자연스럽게 끼어든다":"自然地插进两人之间","무슨 얘기야~ 나도 껴 줘.":"在聊什么～也让我加入嘛。","아, 유진이가 선배님이 요리 잘한다고 자랑했어요.":"啊，维辰一直在炫耀说前辈很会做菜呢。","…그 얘기까지 하지 마요.":"…连那件事都不要说啦。","자랑했다고? 나를? 서운함이 반쯤 녹는다.":"在炫耀？炫耀我？失落的心情融化了一半。","멀찍이서 물을 마시며 지켜본다":"在远处边喝水边看着","물병을 입에 대고 있지만 삼키지는 않는다. 거울 속에서 둘이 나란히 서 있다.":"我把水瓶凑到嘴边，却没有吞下去。镜子里，两个人并肩站着。","둘의 모습이 잘 어울린다. 그게 문제다.":"两个人看起来很登对。这就是问题所在。","스태프에게 가서 일부러 바쁜 척한다":"走去找工作人员，故意装忙","저기, 다음 안무 동선 확인해도 될까요?":"那个，可以确认一下下一段编舞的走位吗？","필요 없는 확인이다. 등 뒤에서 유진의 웃음소리가 들린다. 돌아보지 않는다.":"根本不需要确认。背后传来维辰的笑声。我没有回头。","휴식이 끝나 갈 무렵. 벽 쪽에 유진이 앉아 있다.":"休息时间快结束的时候。维辰坐在墙边。","내가 다가가는 사이 민준이 먼저 유진 옆에 털썩 앉는다. 아무 뜻 없이, 그냥 거기가 비어 있어서.":"在我走过去的时候，{M}抢先一屁股坐到维辰旁边。没有什么特别的意思，只是因为那里空着。","잠깐 앉아 있다 가도 되지?":"我坐一下再走可以吧？","네, 그럼요.":"嗯，当然。","가만히 서 있는 나를 보고 유진이 고개를 든다.":"看到静静站着的我，维辰抬起头。","어, 형도 앉을래요?":"啊，哥也要坐吗？","유진이 움직여 자리를 만든다. 나는 그 자리 앞에 서 있다.":"维辰挪了挪身子，让出位置。我站在那个位置前面。","“그럴까?”":"「要坐吗？」","유진이 내 손을 잡아끌어 옆에 앉힌다.":"维辰拉着我的手，让我坐到他旁边。","형 오늘 손 차가워요.":"哥今天手好冰哦。","그 한마디에 겨우 숨이 돌아온다.":"因为那一句话，我总算能好好呼吸了。","“난 괜찮아, 서 있을게~”":"「我没关系，我站着就好～」","왜요? 음… 알겠어요.":"为什么？嗯…好吧。","유진이 눈을 맞추지 않고 말한다.":"维辰没有看着我的眼睛说。","그 말투가 평소와 같은지 아닌지 모르겠다. 확인할 용기도 없다.":"我分不出他的语气跟平常一不一样。也没有勇气确认。","혼자 맞은편 벽에 앉는다":"一个人坐到对面墙边","시선 너머로 두 사람이 보인다. 둘 사이엔 틈이 없다.":"视线那头看得见两个人。他们之间没有一点缝隙。","내가 자리를 비워 둔 건데, 왜 내가 밀려난 기분일까. 서운함이 조금씩 번져간다.":"明明是我自己把位子空出来的，为什么会有被挤出去的感觉呢。失落感一点一点扩散开来。","그날 저녁 숙소. 유진이 현관 앞에서 운동화 끈을 만지고 있다.":"那天晚上的宿舍。维辰在玄关前绑着鞋带。","형, 저 아는 형이랑 약속 있어서 나가 볼게요. 늦으니까 저녁은 먼저 먹어요.":"哥，我跟认识的哥哥有约，要出去一下。会晚回来，晚餐你先吃吧。","오늘 저녁은 나랑 같이 먹자 했으면서..":"明明说好今天晚上要跟我一起吃饭的..","“알겠어… 조심히 다녀와.”":"「知道了…路上小心。」","정말 괜찮아요?":"真的没关系吗？","괜찮지~ 형은 라면 혼자 먹으면 되지!":"没关系啦～哥一个人吃泡面就好了嘛！","유진이 내 얼굴을 한 번 더 보다가 고개를 끄덕인다.":"维辰又看了我一眼，然后点点头。","들켰나. 아니, 안 들켰겠지.":"被发现了吗？不，应该没有吧。","“오늘 나랑 양꼬치 먹기로 했잖아…” 서운한 티를 조금 낸다":"「今天不是说好要跟我吃羊肉串吗…」稍微表现出失落","아… 맞다. 죄송해요.":"啊…对耶。对不起。","유진이 잠깐 입을 닫았다가 말한다.":"维辰沉默了一下才开口。","일찍 올게요. 형이 먹고 싶다는 거 사 올게요.":"我会早点回来。哥想吃什么，我买回来。","투정 부렸다 싶어 얼굴이 뜨겁다. 그런데 일찍 오겠다는 말이 이상하게 오래 남는다.":"觉得自己好像在耍脾气，脸一阵发烫。可是那句会早点回来，却莫名地在心里停留了很久。","“저녁은 나랑 먹으면 안 돼?”":"「晚餐不能跟我一起吃吗？」","아… 오늘은 먼저 잡은 약속이라서요. 다음에 같이 먹어요.":"啊…今天是先约好的。下次再一起吃吧。","유진이 대수롭지 않게 대답한다. 그 대수롭지 않음이 더 아프다.":"维辰回答得一副无所谓的样子。那份无所谓让人更痛。","유진이 나간 저녁. 숙소가 이렇게 넓었나. 유진이 없으니 TV 소리만 크다.":"维辰出门后的晚上。宿舍原来这么大吗。维辰不在，只剩电视的声音特别大。","원래라면 지금쯤 유진이랑 마주 앉아 같이 양꼬치를 먹고 있었을 텐데. 대신 혼자 라면을 끓였다.":"本来这个时候，应该要跟维辰面对面坐着一起吃羊肉串的。结果我一个人煮了泡面。","혼자 먹는 라면은 맛이 없다. 결국 두 젓가락 먹고 내려놓았다.":"一个人吃的泡面一点都不好吃。最后吃了两口就放下了。","지금쯤 뭐 하고 있을까.":"他现在在做什么呢。","몇 시간이 흘러 시계는 어느새 새벽 한 시를 넘겼다. 유진은 아직 돌아오지 않았다.":"几个小时过去，时钟不知不觉已经过了凌晨一点。维辰还没回来。","통화 목록을 연다. 맨 위에 유진의 이름이 있다. 통화 버튼 위에 엄지를 올렸다가 내린다. 다시 올린다.":"打开通话记录。最上面是维辰的名字。我把拇指放到通话键上，又收回来。再放上去。","“유진아, 언제 들어와?” 전화를 건다":"「维辰，你什么时候回来？」打电话给他","통화 버튼을 누른다. 연결음이 길게 이어진다.":"按下通话键。拨号音长长地响着。","연결음이 세 번 울리고 유진이 받는다.":"响了三声，维辰接起电话。","유진아, 언제 들어와?":"维辰，你什么时候回来？","어… 아직요. 형 아직 안 잤어요?":"呃…还没。哥还没睡吗？","네가 아직 안 와서…":"因为你还没回来…","얘기가 아직 안 끝나서, 형 먼저 자요. 나중에 연락할게요.":"话还没说完，哥先睡吧。我晚点再联络你。","말투는 평소와 같은데 속도가 빠르다. 대답 사이사이 뒤쪽 소리에 귀를 기울이는 것 같다. 내가 무슨 말을 더 하기도 전에 통화가 끊긴다.":"语气跟平常一样，速度却很快。回答的空档，他好像在留意身后的声音。还没等我多说什么，电话就挂断了。","얼른 끊고 싶어 하는 것 같았는데, 내 착각일까. 괜히 전화를 걸어 방해한 것만 같아 기분이 저조해진다.":"他好像很想赶快挂电话，是我想太多了吗？总觉得自己白白打电话去打扰他，心情一下子低落下来。","몇 분 뒤 메시지가 온다.":"几分钟后，传来一则消息。","금방 들어갈게요":"我马上回去","그 한 줄을 세 번 읽는다.":"那一行字我看了三遍。","연락이 됐으니 그걸로 됐다고 말하고 싶은데, 마음이 잘 따라 주지 않는다.":"明明想说联络上了就好，心却怎么也跟不上。","통화 버튼에서 손을 뗀다":"把手指从通话键上移开","핸드폰을 엎어 놓는다.":"把手机翻过来盖着。","방해하는 사람이 되기 싫다. 나이도 더 많은 주제에.":"我不想当打扰别人的人。明明年纪还比较大。","어른스러운 척, 사실은 겁쟁이.":"假装成熟，其实是个胆小鬼。","멤버 단톡방에서 아무 이야기나 한다":"在成员群组里随便聊天","단톡방에 의미 없는 사진을 올린다. 멤버들이 웃음 이모티콘을 달아 준다.":"在群组里传了一张没什么意义的照片。成员们给了大笑的表情符号。","유진의 이름만 대화창 맨 아래에 조용히 남아 있다.":"只有维辰的名字，安静地留在聊天室的最下面。","며칠 뒤 아침, 식탁. 유진이 핸드폰을 보다가 또 웃는다. 나는 숟가락을 든 채 그 얼굴을 본다.":"几天后的早上，餐桌前。维辰看着手机又笑了。我拿着汤匙，看着那张脸。","평소라면 “뭐 봐? 나도 보여줘~” 하며 어깨를 부딪혔을 거다. 하지만 오늘은 목소리가 나오지 않는다.":"平常的话，我早就撞撞他的肩膀说「在看什么？也给我看～」了。可是今天，声音发不出来。","…밥 먹자.":"…吃饭吧。","네? 아, 네. 형 어제 늦게 잤어요? 피곤해 보이는데.":"嗯？啊，好。哥昨天很晚睡吗？看起来很累耶。","평소처럼 웃으며 말을 건네는 일이 이렇게 어려운 일이었나.":"像平常一样笑着跟他说话，原来是这么困难的事吗。","“왜 얼굴 많이 부었어~?” 라며 억지로 장난을 건다":"「脸怎么这么肿啊～？」勉强开个玩笑","…안 부었어요. 살 빠진 것 같은데.":"…没有肿啦。我觉得是瘦了。","유진이 웃지 않는다. 웃음을 기대했던 내 입꼬리만 어색하게 남는다.":"维辰没有笑。只剩下我等着他笑的嘴角，尴尬地挂着。","“아직 잠이 덜 깼나 보지.” 방으로 간다":"「大概还没睡醒吧。」回到房间","방문을 닫고 등을 기댄다. 식탁에서 유진이 의자를 미는 소리가 들린다. 따라오는 발소리는 없다.":"关上房门，背靠着门。听见维辰在餐桌那边推开椅子的声音。没有跟过来的脚步声。","따라와 주길 바란 내가 제일 이상하다.":"希望他跟过来的我，才是最奇怪的。","“유진아, 오늘 저녁에 시간 돼?” 용기를 낸다":"「维辰，今天晚上有空吗？」鼓起勇气","오늘이요? …네, 돼요.":"今天吗？…嗯，有空。","그럼 같이 밥 먹자. 형이 쏠게.":"那一起吃饭吧。哥请客。","유진이 핸드폰을 내려놓고 나를 똑바로 본다. 그제야 내가 이 시선을 얼마나 기다렸는지 안다.":"维辰放下手机，直直地看着我。那时我才知道，自己有多么期待这道目光。","며칠이 지난다. 각자 스케줄이 많아 숙소에서 얼굴 볼 일이 줄었다.":"几天过去了。各自的行程都很多，在宿舍碰面的机会变少了。","메시지 창을 연다. 위로 올려 봐도 대화의 시작은 늘 내 말풍선이다.":"打开聊天室。不管怎么往上滑，对话的开头永远是我的对话框。","유진아 밥은 먹었어?":"维辰吃饭了没","오늘 촬영장 춥던데 따뜻하게 입어":"今天拍摄现场好冷 穿暖一点","숫자 1이 사라지고, 답장은 금방 온다.":"数字1消失了，回覆很快就来了。","네 먹었어요":"嗯吃了","형도 꼭 챙겨 먹어요":"哥也要记得好好吃饭哦","다정한 답장. 거기서 끝이다.":"温柔的回覆。然后就到此为止。","대화를 이어 가는 건 이번에도 내 몫이다.":"把对话延续下去的，这次也是我。","“오늘 끝나고 뭐 해?” 한 번 더 보낸다":"「今天结束后要做什么？」再传一则","오늘 끝나고 뭐 해?":"今天结束后要做什么？","1은 금방 사라진다. 답은 한참 뒤에 온다.":"1很快就消失了。回覆却过了好久才来。","피곤해서 숙소 가서 쉬려고요":"好累 想回宿舍休息","그럼 저 이제 촬영 들어갈게요":"那我要进去拍摄了","응 열심히 해":"嗯 加油","“응 알겠어”라고 답장한다":"回覆「嗯知道了」","응 알겠어":"嗯知道了","1이 사라진다. 그걸로 끝이다.":"1消失了。就这样结束了。","알겠다고 보낸 건 나인데, 뭘 더 기다리는 걸까. 알면서도 화면을 몇 번 더 켜 본다.":"说知道了的明明是我，我到底还在等什么呢。明明知道，还是又点亮了屏幕好几次。","쓰던 메시지를 지운다":"删掉正在写的消息","‘요즘 나한테 서운한 거 있어?’ 썼다가 한 글자씩 지운다.":"打了「最近对我有什么不满吗？」，又一个字一个字删掉。","일곱 살이나 많은 형이 할 말은 아니다.":"这不是大七岁的哥哥该说的话。","밤 열두 시가 넘었다. 유진은 아직 숙소에 들어오지 않았다.":"过了晚上十二点。维辰还没回宿舍。","내가 너무 예민하게 구는 걸 수도 있다. 유진이 바쁘다는 건 누구보다 잘 알고 있으니까.":"也许是我太敏感了。维辰有多忙，我比谁都清楚。","그런데도 자꾸 서운한 마음이 드는 건 어쩔 수 없었다.":"即使如此，还是忍不住一次又一次感到失落。","좋아하는 사람에게 나만 계속 다가가는 건, 생각보다 외로운 일이니까.":"因为对喜欢的人，只有自己一直靠近，比想像中还要寂寞。","결국 메시지 창을 연다.":"最后，还是打开了聊天室。","언제 들어와?":"什么时候回来？","1이 그대로 떠 있다. 1분, 2분.":"1一直挂在那里。一分钟，两分钟。","…1이 사라진다.":"…1消失了。","조금 늦을 것 같아요":"可能会晚一点","왜요?":"怎么了？","지금 스케줄 끝난 거 아니야?":"行程不是已经结束了吗？","민준이 형 좀 만나고 갈게요":"我跟{M}哥见个面再回去","심장이 덜컥 내려앉았다. 발밑이 한순간 꺼져 버린 것만 같았다.":"心脏猛地一沉。感觉脚下的地面一瞬间塌了下去。","그래":"好","너 마음대로 해":"随便你","보내 놓고 보니 말끝이 뾰족하다. 지울까 하다가 그냥 둔다.":"传出去之后才发现，语气好尖锐。想删掉，最后还是留着。","형":"哥","하고 싶은 말이 있으면 해요":"有想说的话就说吧","들켰다. 아니, 들키고 싶었던 걸지도 모른다.":"被发现了。不，也许是我想被发现。","요즘 집에 너무 늦게 오는 거 같아":"最近回家都好晚","바빠서 그래요":"因为很忙啊","형도 알잖아요":"哥也知道的","바쁜 거 안다. 그런데 이해하려고 애쓸수록 오히려 서운함이 더 커지는 것 같다.":"我知道他很忙。可是越想理解，失落感好像反而越大。","알아":"我知道","근데 왜 요즘 나랑은 안 놀아?":"可是最近为什么都不跟我玩？","1이 사라진다. 입력 중 표시가 떴다가 사라지고, 다시 뜬다.":"1消失了。正在输入的提示出现又消失，然后又出现。","제가요?":"我吗？","그런 거 아닌 거 알잖아요":"你知道不是那样的","마침표 하나 없는 짧은 답장.":"连一个句号都没有的简短回覆。","그 한 줄을 보는 순간, 가슴 밑에서 뭔가 확 치민다.":"看到那一行字的瞬间，胸口深处有什么猛地涌了上来。","그걸 내가 어떻게 알아. 내 마음도 모르겠는데.":"我怎么会知道。我连自己的心都搞不懂。","손이 떨린다. 생각보다 손가락이 먼저 움직인다.":"手在发抖。手指比脑袋先动了起来。","참지 않고 통화 버튼을 누른다":"不再忍耐，按下通话键","“그래 됐다”까지 치다가, 지우고 전화를 건다":"打到「算了」，删掉后打电话给他","‘그래 됐다’까지 치다가 한 글자씩 지운다. 이렇게 끝낼 수는 없다.":"打到「算了」，又一个字一个字删掉。不能就这样结束。","메시지 창을 닫고 통화 버튼을 세게 누른다.":"关掉聊天室，用力按下通话键。","연결음이 한 번 다 울리기도 전에 끊기듯 넘어간다.":"拨号音还没响完一声，就像被切断般接通了。","여보세요, 소리도 없다. 수화기 너머로 숨소리만 들린다. 그걸 듣자마자 참고 있던 게 터진다.":"连一声「喂」都没有。电话那头只传来呼吸声。一听到那声音，忍了好久的东西瞬间爆发了。","너 나 신경 하나도 안 써?":"你一点都不在乎我吗？","형을 어떻게 신경을 안 써요.":"我怎么可能不在乎哥。","근데 자꾸 나를 피하잖아.":"那你为什么一直躲着我？","생각이 너무 많았어요 그냥.":"只是想太多了而已。","무슨 생각? 나한텐 말 못 해?":"想什么？不能跟我说吗？","나중에… 나중에 다 말해 줄게요.":"以后…以后我都会告诉你的。","너무 답답해.":"好郁闷。","불안하니까.":"因为我很不安。","목이 멘다. 숨을 한 번 고르고 나서야 다음 말이 나온다.":"喉咙哽住了。缓了一口气之后，下一句话才说得出口。","나 항상 불안해하고 있단 말이야.":"我一直都很不安啊。","말해 놓고 나서야 목소리가 떨렸다는 걸 안다. 핸드폰을 쥔 손에 땀이 찬다.":"说出口之后，才发现自己的声音在发抖。握着手机的手满是汗。","침묵. 끊긴 줄 알고 화면을 내려다볼 즈음, 길게 내쉬는 숨소리가 들린다.":"沉默。正当我以为断线了，低头看屏幕的时候，传来一声长长的叹息。","(한숨) 하… 내가 더 불안한데.":"（叹气）哈…我才更不安啊。","순간 아차 싶었다. 순간의 감정에 휩쓸려 미처 다스리지 못한 감정의 끝이 애꿎은 유진을 향했던 것 같다.":"那一瞬间，我惊觉不妙。被一时的情绪冲昏头，没能控制好的情绪，好像全都冲着无辜的维辰去了。","목구멍 끝까지 뜨거운 것이 차오른다. 애써 눌러 왔던 감정이 한순간에 역류했다.":"有什么滚烫的东西一路涌上喉咙。拚命压抑的情绪，一瞬间全部倒流了。","입술을 깨물어도 소용없다. 떨리는 숨이 수화기 너머로 그대로 새어 나간다.":"咬住嘴唇也没用。颤抖的呼吸就这样透过话筒传了过去。","내가 성숙하지 않아서 너무 미안해.":"我不够成熟，真的很对不起。","미안. 그냥 잊어 줘.":"对不起。就当我没说吧。","유진이 대답하기도 전에 통화 종료 버튼을 누른다.":"还没等维辰回答，我就按下了结束通话键。","고개를 들어 보니 내 방 벽에 걸린 유진의 후드가 보인다. 내가 자주 빌려 입던 그 후드다.":"抬起头，看见挂在我房间墙上的维辰的帽T。那件我常常借来穿的帽T。","나도 모르게 그걸 내려 입는다. 소매가 손등을 덮는다. 유진의 옷에서 내가 좋아하는 섬유유연제 향이 난다.":"不知不觉，我把它拿下来穿上。袖子盖住了手背。维辰的衣服上，有我最喜欢的衣物柔顺剂的香味。","나는 유진이보다 일곱 살이나 많은 형인데, 왜 이렇게 서운하지.":"我明明是比维辰大七岁的哥哥，为什么会这么难过呢。","후드를 뒤집어쓰고 침대 위에 웅크려 앉는다.":"我把帽子拉起来罩住头，蜷缩在床上。","무릎 사이에 얼굴을 묻자 참아 왔던 눈물이 뚝뚝 떨어진다. 소매 끝이 점점 축축해지고, 내 눈물에 유진의 냄새가 섞인다.":"把脸埋进膝盖之间，忍住的眼泪就啪嗒啪嗒地掉了下来。袖口渐渐变得湿透，维辰的味道混进了我的眼泪里。","소리가 밖으로 새지 않게 무릎에 얼굴을 더 깊숙이 묻는다.":"为了不让声音传出去，我把脸更深地埋进膝盖。","좋아한다는 말도 못 하면서 서운해할 자격이나 있겠어. 이 정도만 하자, 이 정도만. 다시 감정을 꾹꾹 눌러 보지만, 그게 잘 안 된다.":"连喜欢都说不出口，哪有资格觉得难过。就到这里吧，只要到这里就好。我试着再次把情绪用力压下去，却怎么也做不到。","현관 비밀번호 소리. 예정보다 훨씬 일찍 유진이가 숙소에 왔다. 현관문이 닫히는 소리가 들리기도 전에, 다급한 유진의 발소리가 들린다.":"玄关密码锁的声音。维辰比预定的时间早了好多回到宿舍。还没听见玄关门关上的声音，就先听见维辰急促的脚步声。","노크도 없이 방문이 열린다. 문 앞에 유진이 서 있다. 손에는 편의점 봉지가 들려 있다. 그 안에 내가 먹고 싶다고 했던 젤리가 보인다.":"房门连敲都没敲就打开了。维辰站在门口，手上提着便利店的袋子。里面看得到我说过想吃的软糖。","유진이 아무 말 없이 한 걸음 들어온다. 나는 얼굴을 돌렸지만 이미 늦었다.":"维辰一句话也没说，往里面走了一步。我别过脸，但已经来不及了。","유진의 시선이 내가 입고 있는 자기 후드에 잠시 머물다가, 눈물에 젖은 소매 끝으로 천천히 옮겨 간다.":"维辰的视线在我身上穿着的他的帽T上停留了一下，然后慢慢移到被泪水浸湿的袖口。","벗을 틈이 없었다. 변명할 틈도.":"来不及脱掉。也来不及找借口。","“형이 왜 미안해요.” 유진이 속상한 얼굴로 묻는다":"「哥为什么要道歉？」维辰难过地问","형이 왜 미안해요.":"哥为什么要道歉？","유진이 침대 앞에 무릎을 꿇고 앉아 내 얼굴을 올려다본다.":"维辰在床前跪坐下来，抬头看着我的脸。","그렇게 끊어 버리면 제가 어떻게 잊어요.":"你那样挂掉电话，我怎么可能忘得了。","나도 모르게 내뱉은 말이었는데, 그 말을 붙잡고 여기까지 달려올 줄은 몰랐다.":"明明是不经意脱口而出的话，没想到他会抓着那句话，一路跑到这里来。","유진이 말없이 눈물을 닦아 준다":"维辰默默帮我擦掉眼泪","유진이 말없이 손을 뻗어 내 눈가의 눈물을 닦아 준다.":"维辰默默伸出手，擦掉我眼角的泪水。","손끝이 차갑다. 밖에서부터 뛰어온 사람의 손이다.":"指尖冰冰的。是从外面一路跑回来的人的手。","밀
