<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사랑한다고 해 줘</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
:root{--bg:#14102a;--fg:#f6eefc;--pk:#ff8fb1;--bl:#8fb6ff;--red:#ff8fb1;--moon:#f6eefc;--mist:#b9b0d0;--lamp:#ff8fb1;--frost:#8fb6ff;--ln:#ffffff44;
 --serif:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;--pix:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--pix);overflow:hidden}
#app{position:relative;height:100%;max-width:480px;margin:auto;overflow:hidden;background:var(--bg)}
/* scene */
#bg{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#3b2f4f,#1c1730)}
#bgi,#cg{position:absolute;left:0;right:0;top:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 210px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(#000 80%,#0000);mask-image:linear-gradient(#000 80%,#0000);transition:opacity .4s}
#cg{display:none}#cg.on{display:block}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(#14102a66 0,#14102a00 16%,#14102a00 52%,#14102a99 74%,#14102a 100%)}
.dorm,.kitchen,.alone,.phone,.bed,.hood,.jelly,.morn,.prac,.ter{background:linear-gradient(#3b2f4f,#1c1730)}
#fd{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:9;transition:opacity .3s}
/* phone */
#ph{position:absolute;left:0;right:0;top:64px;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 250px);display:none;align-items:center;justify-content:center;z-index:1}
#ph.on{display:flex}
#phi{position:relative;height:100%;aspect-ratio:9/16;max-width:78%;border-radius:26px;background:linear-gradient(#2a2145,#14102a 65%,#0d0a1d);container-type:inline-size;color:var(--fg);font-family:var(--pix);box-shadow:0 0 0 6px #0a0618,0 0 0 7px #ffffff44,0 24px 50px #0009,0 0 40px #ff8fb122;overflow:hidden}
#phc{position:absolute;left:8%;top:3.5%;font-size:4.2cqw}
#phn{position:absolute;left:0;right:0;top:19%;text-align:center;font-size:10cqw}
#phs{position:absolute;left:0;right:0;top:33%;text-align:center;font-size:4.6cqw;color:#d6cce8}
#phd{position:absolute;left:0;right:0;top:39%;display:flex;justify-content:center;gap:3cqw}
#phd i{width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--pk);animation:pd 1.2s steps(1) infinite}
#phd i:nth-child(2){animation-delay:.4s}#phd i:nth-child(3){animation-delay:.8s}
@keyframes pd{0%{opacity:1}33%{opacity:.25}66%{opacity:.25}}
#phd.hide{display:none}
#pht{position:absolute;left:0;right:0;top:38.5%;text-align:center;font-size:3.8cqw;color:#b9b0d0;display:none}
#pbt{position:absolute;left:8%;right:8%;top:54%;display:flex;justify-content:space-between;transition:opacity .3s}
#pbt span{display:flex;flex-direction:column;align-items:center;gap:2.4cqw;font-size:3.4cqw;color:#d6cce8}
#pbt i{display:grid;place-items:center;width:17cqw;height:17cqw;border-radius:50%;background:#ffffff1a;font-style:normal;font-size:6cqw;filter:grayscale(1)}
#phe{position:absolute;left:50%;top:76%;width:18cqw;height:18cqw;margin-left:-9cqw;border-radius:50%;background:#ff6b8f;display:grid;place-items:center;transition:opacity .3s}
#phe i{width:8cqw;height:3cqw;border-radius:3cqw 3cqw 1cqw 1cqw;background:#fff}
#phx,#phy,#pmt{display:none!important}
#ph.off #pht{display:block}
#ph.off #pbt,#ph.off #phe{opacity:.3}
/* chat */
#chat{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 250px);display:none;flex-direction:column;background:#120d28e6;border:1px solid #fff4;border-radius:16px;z-index:1;box-shadow:0 14px 40px #0008}
#chat.on{display:flex}
#chat header{padding:11px 16px;border-bottom:1px solid #fff2;font-size:15px;text-align:center}
#cl{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
#cl::-webkit-scrollbar{display:none}
#cl p{max-width:76%;padding:8px 13px;font-size:15px;line-height:1.5;word-break:keep-all;border-radius:16px}
#cl .H{position:relative;align-self:flex-end;background:var(--pk);color:#2a1030;border-bottom-right-radius:5px}
#cl .Y{align-self:flex-start;background:#ffffff1c;color:var(--fg);border-bottom-left-radius:5px}
#cl .H+.Y,#cl .Y+.H{margin-top:8px}
#cl .H.u::before{content:"1";position:absolute;right:calc(100% + 6px);bottom:2px;font-size:12px;line-height:1;color:#ffe066}
#cl .tyb{display:flex;gap:4px;align-items:center;padding:12px 14px}
#cl .tyb i{width:6px;height:6px;border-radius:50%;background:#d6cce8;animation:tyd 1s ease-in-out infinite}
#cl .tyb i:nth-child(2){animation-delay:.15s}#cl .tyb i:nth-child(3){animation-delay:.3s}
@keyframes tyd{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
#cl p.new{animation:pop .28s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
#box.tin,#box.tin small{visibility:hidden!important}
#tap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 90px);text-align:center;font-size:13px;color:var(--mist);display:none;z-index:3;pointer-events:none;animation:bl 1.6s steps(2) infinite}
#tap.on{display:block}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:2}
#game.scr{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 9vh)}
.hide{display:none!important}
/* buttons */
.mb{display:block;width:min(260px,80%);margin:6px auto;font-family:var(--pix);font-size:18px;color:var(--fg);background:#ffffff14;border:1.5px solid #ffffff55;border-radius:12px;padding:12px;cursor:pointer;transition:background .2s,border-color .2s}
.mb:hover,.mb:focus-visible{background:#ff8fb12b;border-color:var(--pk);outline:0}
button:focus-visible{outline:3px solid var(--pk)}
/* title */
#menu{z-index:6;align-items:center;justify-content:flex-end;text-align:center;background:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 9vh)}
#menu::before{content:"";position:absolute;inset:0;z-index:-1;--ph:calc(min(100vw,480px)*1.334);background:linear-gradient(#14102a8c,#14102a00 12%) top/100% var(--ph) no-repeat,linear-gradient(#14102a00 38%,#14102ab3 66%,#14102a 96%) top/100% var(--ph) no-repeat,radial-gradient(ellipse 80% 60% at 50% 40%,#14102a00 60%,#14102a80 100%) top/100% var(--ph) no-repeat,linear-gradient(#2a1d5a47,#2a1d5a47) top/100% var(--ph) no-repeat,url(q_cover.jpg) top center/100% auto no-repeat;background-color:#14102a}
#menu>*{position:relative}
.cv{margin-bottom:28px}
#menu h1{font-weight:400;font-size:clamp(32px,9.5vw,52px);line-height:1.2;margin-bottom:10px;text-shadow:0 0 24px var(--pk);white-space:nowrap}
.cv-d{display:none}
.cv-s{opacity:.8;font-size:15px}
.mw{width:100%;display:flex;flex-direction:column;align-items:center}
#menu .cv-n{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;font-size:12px;opacity:.6}
.devb{margin:10px auto 0;font-family:var(--pix);font-size:13px;color:#ffd6e4;background:#0006;border:1px dashed #ff8fb188;border-radius:999px;padding:6px 14px;cursor:pointer}
/* game chrome */
#bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:8px;right:8px;display:flex;justify-content:flex-end;gap:3px;z-index:5}
#bar button{font-family:var(--pix);font-size:11px;letter-spacing:-.02em;color:var(--fg);background:#0007;border:1px solid #fff4;border-radius:999px;padding:4px 6px;cursor:pointer;white-space:nowrap}
#bar button.on{background:var(--pk);color:#2a1030;border-color:var(--pk)}
#bk{margin-right:auto}
#chap{display:none}
#nm{align-self:flex-start;margin:0 0 -10px 12px;position:relative;z-index:3;box-shadow:0 2px 8px #0004;background:var(--pk);color:#2a1030;border-radius:999px;padding:2px 14px;font-size:15px}
#nm.nY{background:var(--bl);color:#10203a}
#nm.nM{background:#ffd6e4;color:#2a1030}
#nm.nG{background:#b6e88f;color:#1c2e10}
#box{position:relative;min-height:158px;max-height:230px;overflow-y:auto;padding:20px 18px 30px;font-size:17px;line-height:1.8;word-break:keep-all;cursor:pointer;color:#2a2140;background:#fbf8ffee;border:1px solid #fff;border-radius:14px;scrollbar-width:none;box-shadow:0 8px 28px #0007}
#box::-webkit-scrollbar{display:none}
#box.mono{color:#a8476b}
#box.nar{color:#3a3150}
#box small{position:absolute;right:12px;bottom:6px;color:#7a6c96;opacity:.8;font-size:12px;visibility:hidden}
#box small::after{content:"▼"}
#box.done small{visibility:visible}
@keyframes bl{50%{opacity:0}}
#ch{display:flex;flex-direction:column;gap:11px;margin-bottom:12px;position:relative;z-index:6}
#ch button{font-family:var(--pix);font-size:17px;color:#2a2140;background:#fbf8ffee;border:1px solid #fff;border-left:4px solid var(--bl);border-radius:14px;padding:15px 16px;text-align:left;cursor:pointer;word-break:keep-all;line-height:1.5;box-shadow:0 6px 20px #0006;transition:background .2s,transform .15s}
#ch button:hover,#ch button:focus-visible{background:#eef3ff;transform:translateX(3px);outline:0}
/* overlays */
#ov{background:#0a0618f2;justify-content:flex-start;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 30px;z-index:8}
#ov>small{color:var(--pk);letter-spacing:.1em;font-size:14px}
#ov h2{font-size:28px;font-weight:400;margin:6px 0 12px}
#ov p{line-height:1.8;margin:0 auto 20px;max-width:34ch;word-break:keep-all}
.lg{padding:7px 0;border-bottom:1px solid #fff2;font-size:15px;line-height:1.6}.lg b{color:var(--pk);margin-right:6px}
.gl{background:#ffffff12;border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.7;font-size:14px}.gl small{color:var(--pk)}
#ov input{font-family:var(--pix);font-size:18px;text-align:center;width:min(260px,80%);margin:6px auto 18px;display:block;padding:10px;background:#ffffff14;color:var(--fg);border:1.5px solid #ffffff55;border-radius:12px}
#ov input:focus{outline:3px solid var(--pk)}
.dj{display:block;width:100%;text-align:left;font-family:var(--pix);background:#ffffff10;color:var(--fg);border:1px solid #fff3;border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;line-height:1.5;font-size:14px}
.dj:hover{border-color:var(--pk)}.dj b{color:var(--pk);margin-right:6px;font-weight:400}.dj small{display:block;color:var(--mist);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--pk);color:#2a1030;padding:6px 16px;border-radius:999px;font-size:14px;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>


</head><body><div id="app">
<div id="bg" class="dorm"><i id="bgi"></i><i id="cg"></i><div id="ph"><div id="phi"><span id="phc">AM 01:08</span><b id="phn">유진</b><span id="phs">전화 거는 중…</span><span id="phd"><i></i><i></i><i></i></span><span id="pht"></span><div id="pbt"><span><i>🔈</i>스피커</span><span><i>⌗</i>키패드</span><span><i>🎙</i>음소거</span></div><span id="phe"><i></i></span><span id="phx"></span><span id="phy"></span><span id="pmt">AM 01:13</span></div></div><div id="chat"><header><b>유진</b></header><div id="cl"></div></div></div><div id="fd"></div>
<div id="menu" class="scr"><div class="cv"><h1>사랑한다고 해 줘</h1><i class="cv-d"></i><p class="cv-s">가장 가까운 사람이 멀게 느껴질 때</p><b id="cvc" hidden></b></div><div class="mw"><button class="mb" id="bn">처음부터</button><button class="mb" id="bc">이어서 하기</button><button class="mb" id="bg2">엔딩 갤러리</button><button id="devj" class="devb">장면 바로가기 (수정용)</button></div><p class="cv-n">한유진 · 장하오</p></div>

<script>
const n=t=>['N',t],m=t=>['M',t],h=t=>['H',t],y=t=>['Y',t],g=t=>['G',t];
const vo=(l,f)=>(l[2]=0,l[3]=f,l);
const tH=t=>['TH',t],tY=t=>['TY',t],tw=l=>(l[2]=0,l[4]='typing',l);
const NM={M:'하오 (속마음)',H:'하오',Y:'한유진',G:'김민준',TH:'하오 (메시지)',TY:'한유진 (메시지)'};
const S={
a:{b:'dorm',t:'1. 숙소의 밤',l:[n('새벽 한 시가 가까운 숙소 거실. 연습을 마친 우리는 소파에 늘어져 있다. 나는 유진이 손에 든 과자 봉지만 노려본다.'),h('유진아, 한 입만. 아~'),n('입을 벌린 채 눈만 동그랗게 뜨고 올려다본다. 과자를 집던 유진의 손이 멈춘다.'),y('형, 그렇게 귀엽게 쳐다봐도 안 돼요.'),n('유진이 작게 한숨을 쉰다. 먹고 있던 과자를 다정하게 집어 내 입에 넣어 준다. 손끝이 입술 가장자리를 스치고 지나간다.'),y('…말티즈처럼 먹네.'),n('작게 중얼거리고는 유진이 입꼬리를 슬쩍 올린다. 놀리는 말인데 목소리가 이상하게 다정하다.'),h('말티즈? 나 지금 강아지 취급당한 거야?'),y('그래도 깨무는 건 안 돼요.'),n('말끝에 유진이 장난스럽게 웃는다. 그 얼굴을 보고 있자니 나도 모르게 따라 웃게 된다.'),m('이런 사소한 게 좋아서 매일 모른 척 장난을 친다. 좋아한다는 말은 장난에도 못 섞으면서.')],
c:[['유진의 어깨에 기댄다',{y:1},[y('…무거워요, 형.'),n('그러면서도 내가 편하도록 어깨를 살짝 낮춰 준다. 귀끝이 조금 빨갛다.')]],['“하나 더~” 다시 아~ 하고 입을 벌린다',{y:1},[y('…하나만이에요. 진짜로.'),n('그러면서 또 하나를 집어 내 입에 넣어 준다. 입을 다문 채 우물거리는 나를 보고 유진이 작게 웃는다.'),h('유진이가 주니까 더 맛있다~'),n('유진은 대꾸 없이 새 봉지를 뜯어 내 앞에 놓는다. 투덜대는 말과 행동이 반대다.')]],['“고생했어, 우리 유진이” 머리를 쓰다듬는다',{y:1,o:1},[y('…갑자기 왜 그래요.'),n('피하지는 않는다. 손바닥 밑에서 유진이가 눈을 한 번 감았다 뜬다.'),m('좋아한다는 말 대신 오늘도 이것만 했다.')]]],n:'b'},
b:{b:'kitchen',t:'1. 숙소의 밤',l:[n('다음 날 저녁. 식탁에서 라면 물을 올려 놓고 기다리는데, 맞은편 유진의 핸드폰이 짧게 울린다.'),n('화면을 본 유진이 피식 웃는다. 잘 웃지 않는 사람이 소리까지 내서.'),y('아, 민준 형이에요. 어제 같이 본 영화 결말 갖고 또 한마디 하네요.'),m('민준. 배우 김민준. 언제부터 이 이름이 이렇게 자연스럽게 나오기 시작했더라.')],
