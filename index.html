function choices(sc){stopVo();$('tap').classList.remove('on');au=0;sk=0;$('b3').classList.remove('on');$('b4').classList.remove('on');const c=$('ch');c.innerHTML='';sc.c.forEach(o=>{const b=document.createElement('button');b.textContent=nz(o[0]);b.onclick=()=>{for(const k in o[1])st.s[k]+=o[1][k];st.lg.push(['H','▶ '+o[0]]);st.q=o[2];st.i=0;st.nx=o[3]||sc.n;c.classList.add('hide');$('box').classList.remove('hide');$('nm').classList.remove('hide');if(sf)tone(700,.1,.05);show()};c.append(b)});$('box').classList.add('hide');$('nm').classList.add('hide');c.classList.remove('hide')}
function ending(k){stopVo();setCg('');au=sk=0;const gg=ls.g('bo_g')||[];if(!gg.includes(k)){gg.push(k);ls.s('bo_g',gg)}const o=$('ov');o.classList.remove('hide');o.style.justifyContent='center';o.style.textAlign='center';o.innerHTML='<small style="color:var(--pk)">'+E[k][0]+'</small><h2>'+E[k][1]+'</h2><p>'+E[k][2]+'</p>';btn(o,'엔딩 갤러리',gal);btn(o,'처음부터',()=>newGame());btn(o,'타이틀로',title)}
function askName(){au_();playBgm();const o=$('ov');o.classList.remove('hide');o.style.justifyContent='center';o.style.textAlign='center';o.innerHTML='<h2>인물 1의 이름을 적어주세요</h2><p>하오와 유진 사이에 나타나는 사람이에요.<br>마음대로 지어도 돼요. (최대 5글자)</p>';const i=document.createElement('input');i.id='pn';i.maxLength=5;i.placeholder='예) 김민준';i.autocomplete='off';o.append(i);const go1=()=>newGame(i.value.replace(/[<>&"'`\\\s]/g,'').slice(0,5)||'민준');btn(o,'시작하기',go1);btn(o,'취소',title);i.onkeydown=e=>{if(e.key==='Enter')go1()};setTimeout(()=>i.focus(),50)}
function btn(p,t,f){const b=document.createElement('button');b.className='mb';b.textContent=t;b.onclick=f;p.append(b)}
function title(){stopVo();setCg('');$('game').classList.add('hide');$('ov').classList.add('hide');$('menu').classList.remove('hide');au=sk=0;clearTimeout(tm);clearInterval(ty);ty=0}
function gal(){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='flex-start';o.style.textAlign='left';const gg=ls.g('bo_g')||[];o.innerHTML='<h2>엔딩 갤러리 ('+gg.length+'/'+Object.keys(E).length+')</h2>';Object.keys(E).forEach(k=>{const d=document.createElement('div');d.className='gl';d.innerHTML=gg.includes(k)?'<small>'+E[k][0]+'</small><br><b>'+E[k][1]+'</b><br>'+E[k][2]:'<small>???</small><br>아직 보지 못한 엔딩';o.append(d)});btn(o,'닫기',()=>{o.classList.add('hide');if($('game').classList.contains('hide'))$('menu').classList.remove('hide')})}
function log(){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='flex-start';o.style.textAlign='left';o.innerHTML='<h2>대화 로그</h2>';st.lg.forEach(l=>{const d=document.createElement('div');d.className='lg';const b=document.createElement('b');b.textContent=nz(NM[l[0]]||'')+' ';d.append(b,nz(l[1]));o.append(d)});btn(o,'닫기',()=>o.classList.add('hide'))}
setInterval(()=>{const m=$('menu');if(m.classList.contains('hide'))return;const t=Math.floor((Date.now()-(window.cv0||(window.cv0=Date.now())))/1000);$('cvc').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);
$('bn').onclick=()=>{au_();playBgm();newGame()};
function cont(d){if(!d)return;hist=(d.hs||[]).slice();st=d;ui();setCg(...cgNow());setBg(S[st.id].b);lastT=S[st.id].t||'';if(st.i>=cur().length)after();else{const L=cur();draw(L[st.i-1]||st.last);st.lg.pop()}}
$('bc').onclick=()=>{const d=ls.g('bo_s');if(!d){toast('저장된 기록이 없어요');return}au_();playBgm();cont(d)};
function stopAuto(){au=sk=0;clearTimeout(tm);$('b3').classList.remove('on');$('b4').classList.remove('on')}
function back(){if(busy)return;const ch=!$('ch').classList.contains('hide');if(hist.length<(ch?1:2)){toast('이전 내용이 없어요');return}stopAuto();if(!ch)hist.pop();const d=JSON.parse(hist.pop());st.id=d.id;st.i=d.i;st.s=d.s;st.q=d.q;st.nx=d.nx;st.lg.length=Math.min(st.lg.length,d.n);setBg(S[d.id].b);$('ch').classList.add('hide');$('box').classList.remove('hide');$('nm').classList.remove('hide');$('ov').classList.add('hide');show()}
$('bk').onclick=back;
function resume(inGame){const o=$('ov');o.classList.remove('hide');o.style.justifyContent='center';o.style.textAlign='center';o.innerHTML='<h2>이어서 하시겠어요?</h2><p>하던 곳부터 계속할 수 있어요.</p>';btn(o,'이어서 하기',()=>{o.classList.add('hide');playBgm();if(!inGame){au_();cont(ls.g('bo_s'))}});btn(o,'타이틀로',()=>{o.classList.add('hide');title()})}
document.addEventListener('visibilitychange',()=>{const live=st&&!$('game').classList.contains('hide');if(!live)return;if(document.hidden){ls.s('bo_s',st);stopAuto();stopVo();bgm.pause();ring.pause()}else if($('ov').classList.contains('hide'))resume(true)});
$('bg2').onclick=gal;$('game').addEventListener('click',e=>{if(e.target===$('game')&&$('ch').classList.contains('hide')&&$('ov').classList.contains('hide'))$('box').onclick()});$('box').onclick=()=>{if(busy)return;if(ty){fin();return}clearTimeout(tm);show()};
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!$('game').classList.contains('hide')&&$('ch').classList.contains('hide')&&$('ov').classList.contains('hide')){e.preventDefault();$('box').onclick()}});
$('b1').onclick=log;$('b2').onclick=()=>{ls.s('bo_s',st);toast('저장했어요')};
$('b3').onclick=e=>{au=!au;sk=0;e.target.classList.toggle('on',!!au);$('b4').classList.remove('on');au?show():clearTimeout(tm)};
$('b4').onclick=e=>{sk=!sk;au=0;e.target.classList.toggle('on',!!sk);$('b3').classList.remove('on');sk?show():clearTimeout(tm)};
$('b5').onclick=e=>{mb=!mb;e.target.classList.toggle('on',!!mb);playBgm()};$('b6').onclick=e=>{sf=!sf;if(!sf){stopVo();ring.pause()}e.target.classList.toggle('on',!!sf)};
$('b7').onclick=()=>{ls.s('bo_s',st);title()};
$('b3').classList.remove('on');$('b4').classList.remove('on');title();if(ls.g('bo_s'))resume(false);
</script></body></html>
