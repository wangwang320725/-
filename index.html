想到只是撒娇一下，就能变得这么靠近。","스케줄이 모두 끝난 밤, 숙소 베란다. 유진이 문을 닫고 내 앞에 선다. 평소처럼 담담한 얼굴인데 눈이 곧다.":"所有行程都结束的夜晚，宿舍阳台。维辰关上门，站在我面前。表情一如往常地平静，眼神却很坚定。","추운데 왜 나와 있어요.":"这么冷，怎么跑出来了。","유진이 들고 온 겉옷을 내 어깨 위에 조심스레 둘러 주었다.":"维辰把带来的外套，小心地披在我肩上。","고마워.":"谢谢。","어깨를 감싼 옷자락 사이로 희미한 온기가 스며들었다. 이상하게도 마음까지 따뜻해지는 기분이었다.":"包住肩膀的衣服缝隙间，渗进了淡淡的温度。奇怪的是，好像连心都跟着暖了起来。","저 이런 거 형한테만 해요.":"我只会对哥做这种事哦。","뜻밖의 말에 아무런 대답도 하지 못했다. 그저 유진의 얼굴만 멍하니 바라보았다.":"面对这句意料之外的话，我什么也答不出来。只是愣愣地看着维辰的脸。","제가 나중에 다 얘기해 준다고 했던 거, 기억해요?":"我说过以后会全部告诉你，还记得吗？","기억난다. 엉엉 울던 모습을 유진에게 들켜 버린 그날.":"记得。被维辰撞见我嚎啕大哭的那一天。","부끄러운 기억이 선명하게 떠올라, 말없이 고개만 끄덕였다.":"那段丢脸的记忆清楚地浮现，我只能默默点头。","그날, 민준 형한테 고민 상담하러 갔던 거예요.":"那天，我是去找{M}哥商量烦恼的。","또다시 민준의 이름이었다. 그 이름을 듣는 순간, 마음 한구석에 작은 정전기가 이는 듯했다.":"又是{M}的名字。听到那个名字的瞬间，心里的一角像是起了一点小小的静电。","형을 좋아하는데 어떻게 해야 될지 모르겠어서.":"因为我喜欢哥，却不知道该怎么办。","생각지도 못한 말에 고개를 번쩍 들었다. 유진은 잠시 나와 눈을 맞추더니, 이내 시선을 아래로 떨구었다.":"听到这句意想不到的话，我猛地抬起头。维辰跟我对视了一下，很快就垂下了视线。","…어떤 형?":"…哪个哥？","유진이 당황한 듯 귀끝까지 빨개지더니, 말없이 손가락으로 나를 가리켰다.":"维辰慌张得连耳尖都红透了，默默用手指指向我。","“…유진아, 너 나 좋아해?”":"「…维辰，你喜欢我吗？」","…유진아, 너 나 좋아해?":"…维辰，你喜欢我吗？","유진이 눈을 피하지 않고 고개를 끄덕인다.":"维辰没有避开视线，点了点头。","네. 좋아해요, 형.":"嗯。我喜欢你，哥。","…나만 그런 게 아니었구나.":"…原来不是只有我这样。","“나도 유진이 좋아하지…”":"「我当然也喜欢维辰啊…」","나도 유진이 좋아하지…":"我当然也喜欢维辰啊…","유진이 한 걸음 다가와 내 어깨를 잡으며 말했다.":"维辰往前一步，抓住我的肩膀说。","형이 나한테만 잘해 줬으면 좋겠고, 나한테만 웃어 줬으면 좋겠고, 형이 제일 먼저 찾는 사람도 나였으면 좋겠어요.":"我希望哥只对我好，只对我笑，希望哥第一个找的人也是我。","뭐라고 말해야 할지 몰라 아무 말도 하지 못했다.":"不知道该说什么，什么话都说不出来。","대답을 못 하고 시선을 피한다":"答不出来，移开视线","도망가도 되는데, 오늘은 그냥 듣고 있어요.":"你可以逃跑，但今天就好好听我说。","유진의 목소리가 낮다. 도망칠 곳은 사실 없다.":"维辰的声音很低。其实根本无处可逃。","나 말고 다른 사람이랑 더 친해지는 것도 싫고, 형이 다른 사람한테 나한테 하듯이 다정하게 구는 것도 싫어요.":"我不想你跟别人比跟我更好，也不想哥像对我一样，对别人那么温柔。","당황스러운 마음을 추스를 새도 없이 유진의 말이 이어졌다.":"还来不及整理慌乱的心情，维辰的话就接着说了下去。","그냥 형이 나만 봤으면 좋겠어요. 나만 생각하고, 나만 보고 싶어 하고, 힘들 때도 나한테만 기대고……":"我只希望哥只看着我。只想着我，只想见我，累的时候也只依靠我……","한마디도 보태지 못한 채 그저 유진을 바라보았다. 귓가에 열이 오르는 것이 느껴졌다.":"一句话也插不上，我只是看着维辰。感觉得到耳边渐渐发烫。","……형도 그래요?":"……哥也是这样吗？","쉴 새 없이 이어지던 고백이 멎었다. 대답을 기다리는 유진의 눈빛에는 간절함이 가득 담겨 있었다.":"不停涌出的告白停了下来。等待答案的维辰眼里，满满都是恳切。","“나도 유진이랑 같은 마음인 것 같아.”":"「我好像跟维辰是一样的心意。」","나도 유진이랑 같은 마음인 것 같아.":"我好像跟维辰是一样的心意。","괜한 부끄러움에 애써 감춰 왔던 마음을 조심스레 내어 보였다. 입 밖으로 꺼내고 나니, 그동안 마음 한편에 쌓여 있던 서운함마저 사르르 녹아내리는 듯했다.":"因为莫名的害羞而拚命藏起来的心意，我小心翼翼地拿了出来。说出口之后，连一直堆在心里一角的失落，好像都慢慢融化了。","사랑한다고 말해 주세요.":"请说你爱我。","사랑을 갈구하는 욕심스러운 말에 조금 놀라 유진을 바라보았다. 가슴 한편이 뜨거워지는 듯했다. 그토록 간절하게 내 사랑을 바라는 모습이 어쩐지 애틋하고 사랑스러웠다.":"这句贪心地索求爱的话让我有些吃惊，我看着维辰。胸口一阵发烫。他那样恳切地渴望我的爱，莫名地让人心疼又可爱。","사랑해라고 해 줘.":"说你爱我。","마치 어린아이처럼 떼를 쓰듯, 반말로 다시 한번 사랑을 요구했다.":"就像小孩子耍赖一样，这次连敬语都不用了，再一次讨要爱。","사랑해.":"我爱你。","사랑을 보채는 유진을 바라보며 다정하게 말했다. 그 짧은 한마디에 담긴 마음만큼은 조금도 가볍지 않았다.":"看着吵着要爱的维辰，我温柔地说。那短短一句话里的心意，却一点也不轻。","“……겁이 나.”":"「……我好害怕。」","……겁이 나.":"……我好害怕。","그토록 듣고 싶었던 말이었다. 그러나 벅찬 기쁨이 자리해야 할 곳에 어둡고 짙은 안개가 내려앉았다.":"那是我那么想听到的话。可是本该充满喜悦的地方，却落下了一片又暗又浓的雾。","더 가까워진다는 건, 언젠가 지금보다 더 멀어질 수도 있다는 뜻이니까.":"因为变得更靠近，就代表总有一天，可能会变得比现在更遥远。","함께한 추억도, 당연하게 나누었던 일상도, 무심히 건네던 사소한 손길마저도 언젠가는 전부 잃게 되면 어떡하지.":"一起创造的回忆，理所当然分享的日常，就连不经意间的小小触碰，如果有一天全部都失去了，该怎么办。","저는 겁 하나도 안 나요.":"我一点都不害怕。","조금의 망설임도 없는 목소리. 그 속에 옅은 소나기가 내린다.":"没有一丝犹豫的声音。那声音里，下着一场淡淡的阵雨。","전부 다 너무 헷갈려. 뭐가 맞는지 모르겠어……":"一切都好混乱。我不知道什么才是对的……","이 마음으로 저 사랑을 지켜낼 자신이 없었다.":"我没有自信用这样的心，守住那份爱。","잠시 나를 응시하던 유진이 이내 몰아세우듯 물었다.":"盯着我看了一会儿的维辰，很快就像逼问般开口。","형은 내가 다른 사람 좋아해도 괜찮아요? 다른 사람이랑 만나고, 그 사람한테 사랑한다고 해도?":"哥觉得我喜欢别人也没关系吗？跟别人交往，对那个人说我爱你也没关系吗？","싫다. 상상하는 것만으로도 가슴이 저릿해질 만큼 싫다.":"不要。光是想像，胸口就痛到发麻。我不要。","하지만 사랑했던 기억마저 아픔으로 남게 되면, 그때는 어떡하지.":"可是如果连爱过的记忆都变成痛苦，到时候该怎么办。","어느 쪽도 견딜 자신이 없다.":"哪一边我都没有自信承受。","다른 사람을 사랑하는 유진을 바라보는 것도, 사랑했던 유진을 잃는 것도.":"看着爱上别人的维辰也好，失去曾经爱过的维辰也好。","……미안해.":"……对不起。","떨리는 숨과 함께 내뱉은 대답에 유진은 허탈한 듯 천천히 고개를 떨구었다.":"听到我颤抖着呼吸说出的回答，维辰像是泄了气般，慢慢低下了头。","무언가 말하려는 듯하다 이내 입을 다물었다.":"他好像想说些什么，最后还是闭上了嘴。","……무슨 말인지 알겠어요.":"……我知道你的意思了。","눈물이 터져 버릴 것만 같았다.":"眼泪好像随时都会掉下来。","추워요. 얼른 들어가서 쉬어요. 그러다 감기 걸려.":"好冷。快进去休息吧。会感冒的。","이 순간에도 여전히 내게 사랑을 건넨다.":"即使是这种时候，他还是一样把爱给我。","정말 바보 같다.":"我真的好傻。","유진은 무슨 말을 하려 했을까.":"维辰刚刚想说什么呢。","벌써부터 후회가 밀려온다.":"后悔已经涌了上来。","“그걸 꼭 말로 들어야 알아?”":"「这种事一定要说出口才知道吗？」","그걸 꼭 말로 들어야 알아?":"这种事一定要说出口才知道吗？","유진은 대답 대신 입술을 꾹 깨물었다. 아무래도 내 마음을 직접 확인받고 싶은 모양이다.":"维辰没有回答，只是紧紧咬住嘴唇。看来他是想亲耳确认我的心意。","그럼 하나씩 천천히 하자. 밥도 먹고, 데이트도 하고, 부모님도 만나고~":"那我们一件一件慢慢来。一起吃饭，约会，见父母～","이미 다 했잖아요……":"那些早就都做过了啊……","못마땅한 듯 중얼거리는 유진의 모습에 슬며시 웃음이 났다.":"看着维辰一脸不满地嘟囔，我忍不住偷偷笑了。","더 많이 해야지~ 이제부터는 다르게.":"那就要做更多啊～从现在开始，不一样地做。","어떤 의미인지 알아차린 듯 유진의 귓불이 발갛게 물들었다.":"像是明白了是什么意思，维辰的耳垂染得红红的。","이내 내 어깨에 가만히 이마를 기댔다.":"然后轻轻把额头靠在我的肩上。","내가 그렇게 좋아?":"有那么喜欢我吗？","……네.":"……嗯。","긴장이 풀린 듯 안도의 숨과 함께 수줍은 대답이 돌아왔다. 그 솔직한 모습이 퍽 사랑스러웠다.":"像是紧张终于放松，伴着安心的叹息，传来害羞的回答。那份坦率的样子，可爱得不得了。","이미 수없이 함께해 온 일들이지만, 앞으로는 그 모든 순간에 조금 다른 의미가 담기겠지.":"虽然都是一起做过无数次的事，但从今以后，每一个瞬间都会有一点不一样的意义吧。","유진과 함께할 내일이 조금은 기대되기 시작했다.":"我开始有一点点期待，和维辰一起的明天了。","형이 다른 사람 옆에 있는 게 싫다고 했죠. 사실은 그보다 더해요. 형이 웃는 얼굴은 저만 봤으면 좋겠어요. 이상한 말이죠.":"我说过讨厌哥待在别人身边吧。其实不只那样。我希望哥的笑容只有我能看到。很奇怪吧。","안 이상해. 나도 네가 민준이랑 웃을 때 그랬어.":"不奇怪。我看到你跟{M}一起笑的时候，也是这样。","유진이 처음으로 어린 얼굴로 웃는다. 맞잡은 손이 조금 더 단단해진다.":"维辰第一次露出孩子般的笑容。牵着的手又握得更紧了一点。","그럼 형 연락은 이제 제가 제일 먼저 받는 거예요. 약속해요.":"那以后哥的联络，都要我第一个收到哦。约好了。","약속. 대신 너도 서운하면 말해.":"约好了。不过你难过的时候也要说。","며칠 뒤 복도. 민준이 내게 속삭인다.":"几天后的走廊。{M}小声地对我说。","선배님, 저 눈치 늦게 챘는데요. 유진이가 저한테 시선 쏘길래 그냥 도망쳤어요. 두 분 잘되셨으면 해요.":"前辈，我其实很晚才察觉，维辰一直瞪我，我就先逃了。希望两位能好好的。","유진이 내 뒤에서 헛기침을 한다. 귀가 빨갛다. 독점욕은 이렇게 귀여운 모양이기도 하다.":"维辰在我身后清了清喉咙。耳朵红红的。原来占有欲，也能是这么可爱的样子。","사랑한다고 해 줘":"说你爱我","나 항상 불안해하고 있단 말이야":"我一直都很不安啊","처음부터":"从头开始","이어서 하기":"继续游戏","엔딩 갤러리":"结局图鉴","한유진 · 장하오":"韩维辰 · 章昊","로그":"记录","저장":"存档","자동":"自动","스킵":"跳过","효과음":"音效","메뉴":"菜单","화면을 눌러 계속":"点击画面继续","유진":"维辰","스피커":"免提","키패드":"键盘","음소거":"静音","통화 종료":"通话结束","전화 거는 중…":"拨号中…","타이틀로":"回到标题","그 사람의 이름은?":"那个人叫什么名字？","유진과 하오 사이에 나타나는 사람이에요.":"出现在维辰和章昊之间的人。","마음대로 지어도 돼요. (최대 5글자)":"名字可以随意取。（最多5个字）","예) 김민준":"例）金敏俊","시작하기":"开始","취소":"取消","아직 보지 못한 엔딩":"尚未看过的结局","닫기":"关闭","대화 로그":"对话记录","저장된 기록이 없어요":"没有存档记录","이전 내용이 없어요":"没有上一段内容","이어서 하시겠어요?":"要继续上次的进度吗？","하던 곳부터 계속할 수 있어요.":"可以从上次停下的地方继续。","저장했어요":"已存档","장하오":"章昊","한유진":"韩维辰","김민준":"{MF}","장하오 (속마음)":"章昊（内心）","장하오 (메시지)":"章昊（消息）","한유진 (메시지)":"韩维辰（消息）","서로의 이름을 부르는 방":"呼唤彼此名字的房间","마음을 확인하고 연인이 된 두 사람.":"确认心意、成为恋人的两个人。","귀여운 독점욕":"可爱的占有欲","유진의 숨겨진 질투가 드러난 특별한 결말.":"维辰隐藏的嫉妒显露出来的特别结局。","한 뼘 가까이":"再靠近一点","천천히 가까워지는 두 사람.":"慢慢变得亲近的两个人。","여전히 같은 그룹 멤버":"依然只是同团成员","마음을 표현하지 못한 채 남은 거리.":"没能说出心意而留下的距离。","뒤로":"返回","언어":"语言"},"ja":{"새벽 한 시가 가까운 숙소 거실. 연습을 마친 우리는 소파에 늘어져 있다. 나는 유진이 손에 든 과자 봉지만 노려본다.":"深夜一時近くの宿舎のリビング。練習を終えた僕たちはソファでだらけている。僕はユジンが手に持ったお菓子の袋ばかりにらんでいる。","유진아, 한 입만. 아~":"ユジナ、一口だけ。あーん。","입을 벌린 채 눈만 동그랗게 뜨고 올려다본다. 과자를 집던 유진의 손이 멈춘다.":"口を開けたまま、目をまんまるにして見上げる。お菓子をつまんでいたユジンの手が止まる。","형, 그렇게 귀엽게 쳐다봐도 안 돼요.":"ヒョン、そんなにかわいく見つめてもダメです。","유진이 작게 한숨을 쉰다. 먹고 있던 과자를 다정하게 집어 내 입에 넣어 준다. 손끝이 입술 가장자리를 스치고 지나간다.":"ユジンが小さくため息をつく。食べていたお菓子を優しくつまんで、僕の口に入れてくれる。指先が唇の端をかすめていく。","…말티즈처럼 먹네.":"…マルチーズみたいに食べますね。","작게 중얼거리고는 유진이 입꼬리를 슬쩍 올린다. 놀리는 말인데 목소리가 이상하게 다정하다.":"小さくつぶやいて、ユジンが口の端をそっと上げる。からかう言葉なのに、声が妙に優しい。","말티즈? 나 지금 강아지 취급당한 거야?":"マルチーズ？僕、今子犬扱いされてる？","그래도 깨무는 건 안 돼요.":"でも、噛むのはダメですよ。","말끝에 유진이 장난스럽게 웃는다. 그 얼굴을 보고 있자니 나도 모르게 따라 웃게 된다.":"言い終えたユジンがいたずらっぽく笑う。その顔を見ていると、僕もつられて笑ってしまう。","이런 사소한 게 좋아서 매일 모른 척 장난을 친다. 좋아한다는 말은 장난에도 못 섞으면서.":"こんな些細なことが好きで、毎日知らないふりをしてふざける。好きって言葉は冗談にも混ぜられないくせに。","유진의 어깨에 기댄다":"ユジンの肩にもたれる","…무거워요, 형.":"…重いです、ヒョン。","그러면서도 내가 편하도록 어깨를 살짝 낮춰 준다. 귀끝이 조금 빨갛다.":"そう言いながらも、僕が楽なように肩を少し下げてくれる。耳の先がほんのり赤い。","“하나 더~” 다시 아~ 하고 입을 벌린다":"「もう一個〜」もう一度あーんと口を開ける","…하나만이에요. 진짜로.":"…一個だけですよ。本当に。","그러면서 또 하나를 집어 내 입에 넣어 준다. 입을 다문 채 우물거리는 나를 보고 유진이 작게 웃는다.":"そう言ってまたひとつ、僕の口に入れてくれる。口を閉じてもぐもぐする僕を見て、ユジンが小さく笑う。","유진이가 주니까 더 맛있다~":"ユジンがくれるからもっとおいしい〜","유진은 대꾸 없이 새 봉지를 뜯어 내 앞에 놓는다. 투덜대는 말과 행동이 반대다.":"ユジンは何も言わずに新しい袋を開けて、僕の前に置く。ぶつぶつ言う言葉と行動が正反対だ。","“고생했어, 우리 유진이” 머리를 쓰다듬는다":"「お疲れさま、うちのユジン」頭をなでる","…갑자기 왜 그래요.":"…急にどうしたんですか。","피하지는 않는다. 손바닥 밑에서 유진이가 눈을 한 번 감았다 뜬다.":"よけはしない。手のひらの下で、ユジンが一度目を閉じて、また開ける。","좋아한다는 말 대신 오늘도 이것만 했다.":"好きって言う代わりに、今日もこれだけした。","다음 날 저녁. 식탁에 마주 앉아 두리안을 까고 있는데, 맞은편 유진의 핸드폰이 짧게 울린다.":"次の日の夜。食卓で向かい合ってドリアンを割っていると、向かいのユジンのスマホが短く鳴る。","화면을 본 유진이 피식 웃는다. 잘 웃지 않는 사람이 소리까지 내서.":"画面を見たユジンがふっと笑う。めったに笑わない人が、声まで出して。","아, 민준 형이에요. 어제 같이 본 영화 결말 갖고 또 한마디 하네요.":"あ、{M}ヒョンです。昨日一緒に観た映画の結末について、また一言言ってきて。","민준. 배우 김민준. 언제부터 이 이름이 이렇게 자연스럽게 나오기 시작했더라.":"{M}。俳優の{MF}。いつからこの名前がこんなに自然に出てくるようになったんだっけ。","“둘이 많이 친해졌나 보네.”":"「二人、ずいぶん仲良くなったみたいだね」","장하오가 작게 웅얼거렸다. 말끝이 입 안에서 흐려졌다.":"ジャンハオが小さくつぶやいた。語尾が口の中でかすれた。","네? 방금 뭐라고 하셨어요?":"え？今なんて言いました？","아냐, 혼잣말~":"ううん、ひとりごと〜","민준 형이요? 그냥 연락 자주 하는 형이에요. 시간 되면 같이 봐요.":"{M}ヒョンですか？よく連絡を取るヒョンってだけですよ。時間があったら一緒に会いましょう。","같이 보자는 말이 반가워야 하는데, 이상하게 한 박자 늦게 웃게 된다.":"一緒に会おうって言葉がうれしいはずなのに、なぜか一拍遅れて笑ってしまう。","“좋겠네, 친한 형 생겨서~” 웃어넘긴다":"「よかったね、仲いいヒョンができて〜」笑ってごまかす","형이라기엔… 그냥 편해요. 형이랑 나이도 비슷해서 그런가.":"ヒョンっていうより…ただ気が楽なんです。ヒョンと歳も近いからかな。","나랑 나이가 비슷한 형. 나랑 비슷해서 편하다는 말이 신경 쓰인다.":"僕と歳が近いヒョン。僕に似てるから楽だって言葉が引っかかる。","이미 유진이 옆에는 내가 있는데, 굳이 다른 사람이 필요할까 싶었다.":"ユジンの隣にはもう僕がいるのに、わざわざほかの人が必要なのかな。","말없이 두리안만 깐다":"黙ってドリアンを割り続ける","유진은 핸드폰을 보며 답장을 친다. 엄지가 빠르다. 나는 괜히 두리안 껍질 틈에 칼끝만 더 깊이 밀어 넣는다.":"ユジンはスマホを見ながら返信を打つ。親指が速い。僕はわけもなく、ドリアンの殻のすき間にナイフの先をさらに深く押し込む。","가시 돋친 껍질이 쩍 갈라지는 소리가 유진의 웃음소리에 묻힌다.":"トゲだらけの殻がぱっくり割れる音が、ユジンの笑い声にかき消される。","일주일 뒤 오후, 연습실. 휴식 시간에 문이 열리고 커피 트레이를 든 키 큰 남자가 들어온다. 배우 김민준이다.":"一週間後の午後、練習室。休憩時間にドアが開き、コーヒートレーを持った背の高い男が入ってくる。俳優の{MF}だ。","안녕하세요! 근처에서 촬영하다가 인사만 드리려고 왔어요. 하오 선배님 맞으시죠?":"こんにちは！近くで撮影してたので、挨拶だけしに来ました。ハオ先輩ですよね？","아, 안녕하세요. 커피 감사해요.":"あ、こんにちは。コーヒーありがとうございます。","민준은 예의 바르고 사람 좋아 보인다. 그래서 더 곤란하다. 싫어할 구석이 없다.":"{M}は礼儀正しくて、人がよさそうに見える。だからこそ困る。嫌いになれるところがない。","곧 유진이 바닥에서 일어나 민준 쪽으로 걸어간다. 서로 어깨를 툭 치고, 내가 모르는 농담에 동시에 웃는다.":"やがてユジンが床から立ち上がって{M}のほうへ歩いていく。肩を軽くたたき合って、僕の知らない冗談に同時に笑う。","나한테는 존댓말을 쓰던 유진이가 민준한테는 말을 반쯤 놓는다. 그게 왜 이렇게 눈에 들어올까.":"僕には敬語を使うユジンが、{M}には半分タメ口だ。それがどうしてこんなに目につくんだろう。","둘 사이에 자연스럽게 끼어든다":"二人の間に自然に入り込む","무슨 얘기야~ 나도 껴 줘.":"何の話〜？僕も混ぜて。","아, 유진이가 선배님이 요리 잘한다고 자랑했어요.":"あ、ユジンが先輩は料理が上手だって自慢してたんですよ。","…그 얘기까지 하지 마요.":"…その話までしないでください。","자랑했다고? 나를? 서운함이 반쯤 녹는다.":"自慢してた？僕のことを？寂しさが半分溶ける。","멀찍이서 물을 마시며 지켜본다":"離れたところで水を飲みながら見守る","물병을 입에 대고 있지만 삼키지는 않는다. 거울 속에서 둘이 나란히 서 있다.":"ペットボトルを口に当てているけど、飲み込みはしない。鏡の中で、二人が並んで立っている。","둘의 모습이 잘 어울린다. 그게 문제다.":"二人の姿がよく似合う。それが問題だ。","스태프에게 가서 일부러 바쁜 척한다":"スタッフのところへ行ってわざと忙しいふりをする","저기, 다음 안무 동선 확인해도 될까요?":"あの、次の振り付けの動線を確認してもいいですか？","필요 없는 확인이다. 등 뒤에서 유진의 웃음소리가 들린다. 돌아보지 않는다.":"必要のない確認だ。背中の向こうでユジンの笑い声が聞こえる。振り返らない。","휴식이 끝나 갈 무렵. 벽 쪽에 유진이 앉아 있다.":"休憩が終わりかけたころ。壁ぎわにユジンが座っている。","내가 다가가는 사이 민준이 먼저 유진 옆에 털썩 앉는다. 아무 뜻 없이, 그냥 거기가 비어 있어서.":"僕が近づくあいだに、{M}が先にユジンの隣にどさっと座る。何の意味もなく、ただそこが空いていたから。","잠깐 앉아 있다 가도 되지?":"ちょっと座ってから行ってもいいよね？","네, 그럼요.":"はい、もちろんです。","가만히 서 있는 나를 보고 유진이 고개를 든다.":"じっと立っている僕を見て、ユジンが顔を上げる。","어, 형도 앉을래요?":"あ、ヒョンも座りますか？","유진이 움직여 자리를 만든다. 나는 그 자리 앞에 서 있다.":"ユジンが動いて場所をあける。僕はその場所の前に立っている。","“그럴까?”":"「そうしようかな？」","유진이 내 손을 잡아끌어 옆에 앉힌다.":"ユジンが僕の手を引っぱって隣に座らせる。","형 오늘 손 차가워요.":"ヒョン、今日は手が冷たいですね。","그 한마디에 겨우 숨이 돌아온다.":"その一言で、やっと息ができる。","“난 괜찮아, 서 있을게~”":"「僕は大丈夫、立ってるよ〜」","왜요? 음… 알겠어요.":"どうしてですか？うーん…わかりました。","유진이 눈을 맞추지 않고 말한다.":"ユジンが目を合わせずに言う。","그 말투가 평소와 같은지 아닌지 모르겠다. 확인할 용기도 없다.":"その口調がいつもと同じなのかどうかわからない。確かめる勇気もない。","혼자 맞은편 벽에 앉는다":"ひとりで向かいの壁ぎわに座る","시선 너머로 두 사람이 보인다. 둘 사이엔 틈이 없다.":"視線の先に二人が見える。二人の間にすき間はない。","내가 자리를 비워 둔 건데, 왜 내가 밀려난 기분일까. 서운함이 조금씩 번져간다.":"席を空けたのは僕なのに、どうして押し出された気分なんだろう。寂しさが少しずつ広がっていく。","그날 저녁 숙소. 유진이 현관 앞에서 운동화 끈을 만지고 있다.":"その日の夜、宿舎。ユジンが玄関で靴ひもをいじっている。","형, 저 아는 형이랑 약속 있어서 나가 볼게요. 늦으니까 저녁은 먼저 먹어요.":"ヒョン、知り合いのヒョンと約束があるので出かけてきます。遅くなるので、夕飯は先に食べてください。","오늘 저녁은 나랑 같이 먹자 했으면서..":"今夜は一緒にご飯食べようって言ってたくせに..","“알겠어… 조심히 다녀와.”":"「わかった…気をつけて行ってきて」","정말 괜찮아요?":"本当に大丈夫ですか？","괜찮지~ 형은 라면 혼자 먹으면 되지!":"大丈夫だよ〜ヒョンはラーメンひとりで食べればいいし！","유진이 내 얼굴을 한 번 더 보다가 고개를 끄덕인다.":"ユジンがもう一度僕の顔を見てから、うなずく。","들켰나. 아니, 안 들켰겠지.":"バレたかな。いや、バレてないよね。","“오늘 나랑 양꼬치 먹기로 했잖아…” 서운한 티를 조금 낸다":"「今日は僕とヤンコチ食べるって言ったじゃん…」少しだけ寂しさを見せる","아… 맞다. 죄송해요.":"あ…そうだった。すみません。","유진이 잠깐 입을 닫았다가 말한다.":"ユジンが少し黙ってから口を開く。","일찍 올게요. 형이 먹고 싶다는 거 사 올게요.":"早く帰ります。ヒョンが食べたいもの買ってきますね。","투정 부렸다 싶어 얼굴이 뜨겁다. 그런데 일찍 오겠다는 말이 이상하게 오래 남는다.":"駄々をこねたみたいで顔が熱い。でも、早く帰るって言葉が妙に長く残る。","“저녁은 나랑 먹으면 안 돼?”":"「夕飯は僕と食べちゃダメ？」","아… 오늘은 먼저 잡은 약속이라서요. 다음에 같이 먹어요.":"あ…今日は先に入ってた約束なので。今度一緒に食べましょう。","유진이 대수롭지 않게 대답한다. 그 대수롭지 않음이 더 아프다.":"ユジンがなんでもないことのように答える。そのなんでもなさが、もっと痛い。","유진이 나간 저녁. 숙소가 이렇게 넓었나. 유진이 없으니 TV 소리만 크다.":"ユジンが出かけた夜。宿舎ってこんなに広かったっけ。ユジンがいないと、テレビの音ばかり大きい。","원래라면 지금쯤 유진이랑 마주 앉아 같이 양꼬치를 먹고 있었을 텐데. 대신 혼자 라면을 끓였다.":"本当なら今ごろ、ユジンと向かい合って一緒にヤンコチを食べていたはずなのに。代わりにひとりでラーメンを作った。","혼자 먹는 라면은 맛이 없다. 결국 두 젓가락 먹고 내려놓았다.":"ひとりで食べるラーメンはおいしくない。結局、二口食べて箸を置いた。","지금쯤 뭐 하고 있을까.":"今ごろ何してるんだろう。","몇 시간이 흘러 시계는 어느새 새벽 한 시를 넘겼다. 유진은 아직 돌아오지 않았다.":"何時間か過ぎて、時計はいつの間にか深夜一時を回った。ユジンはまだ帰ってこない。","통화 목록을 연다. 맨 위에 유진의 이름이 있다. 통화 버튼 위에 엄지를 올렸다가 내린다. 다시 올린다.":"通話履歴を開く。いちばん上にユジンの名前がある。通話ボタンの上に親指をのせて、下ろす。またのせる。","“유진아, 언제 들어와?” 전화를 건다":"「ユジナ、いつ帰ってくる？」電話をかける","통화 버튼을 누른다. 연결음이 길게 이어진다.":"通話ボタンを押す。呼び出し音が長く続く。","연결음이 세 번 울리고 유진이 받는다.":"呼び出し音が三回鳴って、ユジンが出る。","유진아, 언제 들어와?":"ユジナ、いつ帰ってくる？","어… 아직요. 형 아직 안 잤어요?":"あ…まだです。ヒョン、まだ寝てないんですか？","네가 아직 안 와서…":"君がまだ帰ってこないから…","얘기가 아직 안 끝나서, 형 먼저 자요. 나중에 연락할게요.":"話がまだ終わってないので、ヒョンは先に寝てください。あとで連絡します。","말투는 평소와 같은데 속도가 빠르다. 대답 사이사이 뒤쪽 소리에 귀를 기울이는 것 같다. 내가 무슨 말을 더 하기도 전에 통화가 끊긴다.":"口調はいつもと同じなのに、話すのが速い。返事の合間に、後ろの音に耳をすませているみたいだ。僕が何か言う前に、電話が切れる。","얼른 끊고 싶어 하는 것 같았는데, 내 착각일까. 괜히 전화를 걸어 방해한 것만 같아 기분이 저조해진다.":"早く切りたがっているみたいだったけど、僕の気のせいかな。わざわざ電話して邪魔しただけみたいで、気分が沈む。","몇 분 뒤 메시지가 온다.":"数分後、メッセージが届く。","금방 들어갈게요":"すぐ帰ります","그 한 줄을 세 번 읽는다.":"その一行を三回読む。","연락이 됐으니 그걸로 됐다고 말하고 싶은데, 마음이 잘 따라 주지 않는다.":"連絡がついたんだからそれでいいって言いたいのに、心がうまくついてこない。","통화 버튼에서 손을 뗀다":"通話ボタンから指を離す","핸드폰을 엎어 놓는다.":"スマホを伏せて置く。","방해하는 사람이 되기 싫다. 나이도 더 많은 주제에.":"邪魔する人にはなりたくない。歳も上のくせに。","어른스러운 척, 사실은 겁쟁이.":"大人ぶって、本当は臆病者。","멤버 단톡방에서 아무 이야기나 한다":"メンバーのグループトークで適当な話をする","단톡방에 의미 없는 사진을 올린다. 멤버들이 웃음 이모티콘을 달아 준다.":"グループトークに意味のない写真を上げる。メンバーたちが笑いの絵文字をつけてくれる。","유진의 이름만 대화창 맨 아래에 조용히 남아 있다.":"ユジンの名前だけが、トーク画面のいちばん下に静かに残っている。","며칠 뒤 아침, 식탁. 유진이 핸드폰을 보다가 또 웃는다. 나는 숟가락을 든 채 그 얼굴을 본다.":"数日後の朝、食卓。ユジンがスマホを見ながらまた笑う。僕はスプーンを持ったまま、その顔を見る。","평소라면 “뭐 봐? 나도 보여줘~” 하며 어깨를 부딪혔을 거다. 하지만 오늘은 목소리가 나오지 않는다.":"いつもなら「何見てるの？僕にも見せて〜」って肩をぶつけていたはずだ。でも今日は声が出ない。","…밥 먹자.":"…ご飯食べよう。","네? 아, 네. 형 어제 늦게 잤어요? 피곤해 보이는데.":"え？あ、はい。ヒョン、昨日遅く寝ました？疲れてるみたいですけど。","평소처럼 웃으며 말을 건네는 일이 이렇게 어려운 일이었나.":"いつもみたいに笑って話しかけることが、こんなに難しいことだったっけ。","“왜 얼굴 많이 부었어~?” 라며 억지로 장난을 건다":"「なんでそんなに顔むくんでるの〜？」と無理にふざける","…안 부었어요. 살 빠진 것 같은데.":"…むくんでません。痩せたと思うんですけど。","유진이 웃지 않는다. 웃음을 기대했던 내 입꼬리만 어색하게 남는다.":"ユジンが笑わない。笑ってくれると思っていた僕の口元だけが、ぎこちなく残る。","“아직 잠이 덜 깼나 보지.” 방으로 간다":"「まだ寝ぼけてるのかな」部屋に戻る","방문을 닫고 등을 기댄다. 식탁에서 유진이 의자를 미는 소리가 들린다. 따라오는 발소리는 없다.":"部屋のドアを閉めて背中を預ける。食卓でユジンが椅子を引く音が聞こえる。ついてくる足音はない。","따라와 주길 바란 내가 제일 이상하다.":"ついてきてほしいと思った僕が、いちばんおかしい。","“유진아, 오늘 저녁에 시간 돼?” 용기를 낸다":"「ユジナ、今日の夜、時間ある？」勇気を出す","오늘이요? …네, 돼요.":"今日ですか？…はい、大丈夫です。","그럼 같이 밥 먹자. 형이 쏠게.":"じゃあ一緒にご飯食べよう。ヒョンがおごるよ。","유진이 핸드폰을 내려놓고 나를 똑바로 본다. 그제야 내가 이 시선을 얼마나 기다렸는지 안다.":"ユジンがスマホを置いて、僕をまっすぐ見る。そこでやっと、僕がこの視線をどれだけ待っていたかを知る。","며칠이 지난다. 각자 스케줄이 많아 숙소에서 얼굴 볼 일이 줄었다.":"何日かが過ぎる。それぞれスケジュールが多くて、宿舎で顔を合わせることが減った。","메시지 창을 연다. 위로 올려 봐도 대화의 시작은 늘 내 말풍선이다.":"トーク画面を開く。上にスクロールしても、会話の始まりはいつも僕の吹き出しだ。","유진아 밥은 먹었어?":"ユジナご飯食べた？","오늘 촬영장 춥던데 따뜻하게 입어":"今日撮影現場寒かったからあったかくしてね","숫자 1이 사라지고, 답장은 금방 온다.":"数字の1が消えて、返信はすぐに来る。","네 먹었어요":"はい食べました","형도 꼭 챙겨 먹어요":"ヒョンもちゃんと食べてくださいね","다정한 답장. 거기서 끝이다.":"優しい返信。そこで終わりだ。","대화를 이어 가는 건 이번에도 내 몫이다.":"会話を続けるのは、今回も僕の役目だ。","“오늘 끝나고 뭐 해?” 한 번 더 보낸다":"「今日終わったら何するの？」もう一度送る","오늘 끝나고 뭐 해?":"今日終わったら何するの？","1은 금방 사라진다. 답은 한참 뒤에 온다.":"1はすぐに消える。返事はずいぶんあとに来る。","피곤해서 숙소 가서 쉬려고요":"疲れたので宿舎に帰って休もうと思います","그럼 저 이제 촬영 들어갈게요":"じゃあ僕もう撮影入りますね","응 열심히 해":"うん頑張って","“응 알겠어”라고 답장한다":"「うんわかった」と返信する","응 알겠어":"うんわかった","1이 사라진다. 그걸로 끝이다.":"1が消える。それで終わりだ。","알겠다고 보낸 건 나인데, 뭘 더 기다리는 걸까. 알면서도 화면을 몇 번 더 켜 본다.":"わかったって送ったのは僕なのに、何をまだ待っているんだろう。わかっていても、画面を何度かつけてみる。","쓰던 메시지를 지운다":"書きかけのメッセージを消す","‘요즘 나한테 서운한 거 있어?’ 썼다가 한 글자씩 지운다.":"「最近僕に何か寂しいことある？」と打って、一文字ずつ消す。","일곱 살이나 많은 형이 할 말은 아니다.":"七つも年上のヒョンが言うことじゃない。","밤 열두 시가 넘었다. 유진은 아직 숙소에 들어오지 않았다.":"夜の十二時を過ぎた。ユジンはまだ宿舎に帰ってこない。","내가 너무 예민하게 구는 걸 수도 있다. 유진이 바쁘다는 건 누구보다 잘 알고 있으니까.":"僕が敏感になりすぎているのかもしれない。ユジンが忙しいことは、誰よりもよくわかっているから。","그런데도 자꾸 서운한 마음이 드는 건 어쩔 수 없었다.":"それでも、何度も寂しくなってしまうのはどうしようもなかった。","좋아하는 사람에게 나만 계속 다가가는 건, 생각보다 외로운 일이니까.":"好きな人に自分ばかりが近づき続けるのは、思っていたより寂しいことだから。","결국 메시지 창을 연다.":"結局、トーク画面を開く。","언제 들어와?":"いつ帰ってくる？","1이 그대로 떠 있다. 1분, 2분.":"1がそのまま残っている。一分、二分。","…1이 사라진다.":"…1が消える。","조금 늦을 것 같아요":"ちょっと遅くなりそうです","왜요?":"どうしてですか？","지금 스케줄 끝난 거 아니야?":"もうスケジュール終わったんじゃないの？","민준이 형 좀 만나고 갈게요":"{M}ヒョンにちょっと会ってから帰ります","심장이 덜컥 내려앉았다. 발밑이 한순간 꺼져 버린 것만 같았다.":"心臓がどきりと沈んだ。足もとが一瞬で崩れ落ちたみたいだった。","그래":"そう","너 마음대로 해":"好きにすれば","보내 놓고 보니 말끝이 뾰족하다. 지울까 하다가 그냥 둔다.":"送ってから見返すと、語尾がとげとげしい。消そうかと思って、そのままにする。","형":"ヒョン","하고 싶은 말이 있으면 해요":"言いたいことがあるなら言ってください","들켰다. 아니, 들키고 싶었던 걸지도 모른다.":"バレた。いや、バレたかったのかもしれない。","요즘 집에 너무 늦게 오는 거 같아":"最近帰ってくるのすごく遅い気がする","바빠서 그래요":"忙しいからですよ","형도 알잖아요":"ヒョンもわかってるじゃないですか","바쁜 거 안다. 그런데 이해하려고 애쓸수록 오히려 서운함이 더 커지는 것 같다.":"忙しいのはわかってる。でも、わかろうとすればするほど、かえって寂しさが大きくなる気がする。","알아":"わかってる","근데 왜 요즘 나랑은 안 놀아?":"でもなんで最近僕とは遊んでくれないの？","1이 사라진다. 입력 중 표시가 떴다가 사라지고, 다시 뜬다.":"1が消える。入力中の表示が出ては消え、また出る。","제가요?":"僕がですか？","그런 거 아닌 거 알잖아요":"そういうのじゃないってわかってるでしょう","마침표 하나 없는 짧은 답장.":"句点ひとつない短い返信。","그 한 줄을 보는 순간, 가슴 밑에서 뭔가 확 치민다.":"その一行を見た瞬間、胸の奥から何かがこみ上げる。","그걸 내가 어떻게 알아. 내 마음도 모르겠는데.":"そんなのどうやってわかるの。自分の気持ちもわからないのに。","손이 떨린다. 생각보다 손가락이 먼저 움직인다.":"手が震える。考えるより先に指が動く。","참지 않고 통화 버튼을 누른다":"こらえずに通話ボタンを押す","“그래 됐다”까지 치다가, 지우고 전화를 건다":"「もういい」まで打って、消して電話をかける","‘그래 됐다’까지 치다가 한 글자씩 지운다. 이렇게 끝낼 수는 없다.":"「もういい」まで打って、一文字ずつ消す。こんなふうに終わらせるわけにはいかない。","메시지 창을 닫고 통화 버튼을 세게 누른다.":"トーク画面を閉じて、通話ボタンを強く押す。","연결음이 한 번 다 울리기도 전에 끊기듯 넘어간다.":"呼び出し音が一回鳴り終わる前に、途切れるようにつながる。","여보세요, 소리도 없다. 수화기 너머로 숨소리만 들린다. 그걸 듣자마자 참고 있던 게 터진다.":"もしもしの声もない。電話の向こうから息づかいだけが聞こえる。それを聞いた瞬間、こらえていたものがあふれ出す。","너 나 신경 하나도 안 써?":"僕のこと全然気にしてないの？","형을 어떻게 신경을 안 써요.":"ヒョンのことを気にしないわけないじゃないですか。","근데 자꾸 나를 피하잖아.":"でも、ずっと僕のこと避けてるじゃん。","생각이 너무 많았어요 그냥.":"考えることが多すぎただけです。","무슨 생각? 나한텐 말 못 해?":"何を考えてたの？僕には言えないの？","나중에… 나중에 다 말해 줄게요.":"あとで…あとで全部話しますから。","너무 답답해.":"すごくもどかしい。","불안하니까.":"不安だから。","목이 멘다. 숨을 한 번 고르고 나서야 다음 말이 나온다.":"喉が詰まる。一度息を整えてから、やっと次の言葉が出る。","나 항상 불안해하고 있단 말이야.":"僕、いつも不安なんだよ。","말해 놓고 나서야 목소리가 떨렸다는 걸 안다. 핸드폰을 쥔 손에 땀이 찬다.":"言ってしまってから、声が震えていたことに気づく。スマホを握る手に汗がにじむ。","침묵. 끊긴 줄 알고 화면을 내려다볼 즈음, 길게 내쉬는 숨소리가 들린다.":"沈黙。切れたのかと思って画面を見下ろしたころ、長く吐き出す息の音が聞こえる。","(한숨) 하… 내가 더 불안한데.":"（ため息）はあ…僕のほうがもっと不安なのに。","순간 아차 싶었다. 순간의 감정에 휩쓸려 미처 다스리지 못한 감정의 끝이 애꿎은 유진을 향했던 것 같다.":"その瞬間、しまったと思った。一時の感情に流されて、抑えきれなかった気持ちの矛先が、何も悪くないユジンに向いてしまった気がする。","목구멍 끝까지 뜨거운 것이 차오른다. 애써 눌러 왔던 감정이 한순간에 역류했다.":"喉の奥まで熱いものがこみ上げる。必死に押さえ込んできた感情が、一瞬で逆流した。","입술을 깨물어도 소용없다. 떨리는 숨이 수화기 너머로 그대로 새어 나간다.":"唇をかんでも無駄だ。震える息が、電話の向こうにそのまま漏れていく。","내가 성숙하지 않아서 너무 미안해.":"僕が大人じゃなくて、本当にごめん。","미안. 그냥 잊어 줘.":"ごめん。もう忘れて。","유진이 대답하기도 전에 통화 종료 버튼을 누른다.":"ユジンが答える前に、通話終了ボタンを押す。","고개를 들어 보니 내 방 벽에 걸린 유진의 후드가 보인다. 내가 자주 빌려 입던 그 후드다.":"顔を上げると、部屋の壁にかかったユジンのパーカーが見える。僕がよく借りて着ていたあのパーカーだ。","나도 모르게 그걸 내려 입는다. 소매가 손등을 덮는다. 유진의 옷에서 내가 좋아하는 섬유유연제 향이 난다.":"気づけばそれを下ろして着ている。袖が手の甲を覆う。ユジンの服から、僕の好きな柔軟剤の香りがする。","나는 유진이보다 일곱 살이나 많은 형인데, 왜 이렇게 서운하지.":"僕はユジンより七つも年上のヒョンなのに、どうしてこんなに寂しいんだろう。","후드를 뒤집어쓰고 침대 위에 웅크려 앉는다.":"フードをかぶって、ベッドの上でうずくまる。","무릎 사이에 얼굴을 묻자 참아 왔던 눈물이 뚝뚝 떨어진다. 소매 끝이 점점 축축해지고, 내 눈물에 유진의 냄새가 섞인다.":"膝の間に顔をうずめると、こらえていた涙がぽたぽたと落ちる。袖の先がだんだん湿って、僕の涙にユジンの匂いが混ざる。","소리가 밖으로 새지 않게 무릎에 얼굴을 더 깊숙이 묻는다.":"声が外に漏れないように、膝にもっと深く顔をうずめる。","좋아한다는 말도 못 하면서 서운해할 자격이나 있겠어. 이 정도만 하자, 이 정도만. 다시 감정을 꾹꾹 눌러 보지만, 그게 잘 안 된다.":"好きとも言えないくせに、寂しがる資格なんてあるのかな。これくらいにしよう、これくらいに。もう一度気持ちをぎゅっと押さえ込もうとするけど、うまくいかない。","현관 비밀번호 소리. 예정보다 훨씬 일찍 유진이가 숙소에 왔다. 현관문이 닫히는 소리가 들리기도 전에, 다급한 유진의 발소리가 들린다.":"玄関の暗証番号の音。予定よりずっと早く、ユジンが宿舎に帰ってきた。玄関のドアが閉まる音がするより先に、ユジンの急いだ足音が聞こえる。","노크도 없이 방문이 열린다. 문 앞에 유진이 서 있다. 손에는 편의점 봉지가 들려 있다. 그 안에 내가 먹고 싶다고 했던 젤리가 보인다.":"ノックもなしに部屋のドアが開く。ドアの前にユジンが立っている。手にはコンビニの袋。その中に、僕が食べたいと言っていたグミが見える。","유진이 아무 말 없이 한 걸음 들어온다. 나는 얼굴을 돌렸지만 이미 늦었다.":"ユジンが何も言わずに一歩入ってくる。僕は顔をそむけたけど、もう遅かった。","유진의 시선이 내가 입고 있는 자기 후드에 잠시 머물다가, 눈물에 젖은 소매 끝으로 천천히 옮겨 간다.":"ユジンの視線が、僕が着ている自分のパーカーに少しとどまって、涙で濡れた袖の先へゆっくり移っていく。","벗을 틈이 없었다. 변명할 틈도.":"脱ぐひまもなかった。言い訳するひまも。","“형이 왜 미안해요.” 유진이 속상한 얼굴로 묻는다":"「なんでヒョンが謝るんですか」ユジンがつらそうな顔で聞く","형이 왜 미안해요.":"なんでヒョンが謝るんですか。","유진이 침대 앞에 무릎을 꿇고 앉아 내 얼굴을 올려다본다.":"ユジンがベッドの前にひざまずいて、僕の顔を見上げる。","그렇게 끊어 버리면 제가 어떻게 잊어요.":"あんなふうに切られたら、忘れられるわけないじゃないですか。","나도 모르게 내뱉은 말이었는데, 그 말을 붙잡고 여기까지 달려올 줄은 몰랐다.":"思わずこぼした言葉だったのに、その言葉をつかんでここまで駆けつけてくるなんて思わなかった。","유진이 말없이 눈물을 닦아 준다":"ユジンが黙って涙をぬぐってくれる","유진이 말없이 손을 뻗어 내 눈가의 눈물을 닦아 준다.":"ユジンが黙って手を伸ばし、僕の目元の涙をぬぐってくれる。","손끝이 차갑다. 밖에서부터 뛰어온 사람의 손이다.":"指先が冷たい。外から走ってきた人の手だ。","밀어내야 하는데, 나도 모르게 그 손에 얼굴을 기대고 만다.":"押し返さなきゃいけないのに、気づけばその手に顔を預けてしまう。","…울지 마요, 형.":"…泣かないでください、ヒョン。","“왜 벌써 왔어..?” 하오가 눈물을 감추며 묻는다":"「なんでもう帰ってきたの..？」ハオが涙を隠しながら聞く","왜 벌써 왔어..?":"なんでもう帰ってきたの..？","아니야… 그냥 나 안아 줘..":"なんでもない…ただ抱きしめて..","유진이 대답 대신 봉지를 내려놓고 나를 끌어안는다.":"ユジンが答える代わりに袋を置いて、僕を抱きしめる。","맞닿은 가슴 너머로 유진의 심장 소리가 들린다. 쿵, 쿵, 쿵. 숨이 찰 만큼 빠르다.":"重なった胸の向こうから、ユジンの心臓の音が聞こえる。ドクン、ドクン、ドクン。息が切れるほど速い。","…여기까지 뛰어왔구나. 나 때문에.":"…ここまで走ってきたんだ。僕のせいで。","제가 미안해요.":"僕のほうこそ、すみません。","저는 자꾸 형만 신경 쓰여서… 혹시 형이 그걸 부담스러워할까 봐, 그게 무서웠어요.":"僕、ヒョンのことばかり気になって…ヒョンがそれを重荷に感じたらどうしようって、それが怖かったんです。","나만 불안한 줄 알았다. 유진이도 나만큼, 어쩌면 나보다 더 흔들리고 있었다. 이번엔 나도 말해야 한다.":"不安なのは僕だけだと思っていた。ユジンも僕と同じくらい、もしかしたら僕以上に揺れていた。今度は僕も言わなきゃ。","부담 안 가져. 나는… 유진이가 나를 더 신경 써 줬으면 좋겠어.":"重荷なんかじゃない。僕は…ユジンにもっと僕のこと気にしてほしい。","사실 알고 있었다. 유진이는 늘 나를 지켜보고, 내가 조금만 달라져도 먼저 알아채고 안아 주던 애라는 걸.":"本当はわかっていた。ユジンはいつも僕を見守っていて、僕が少しでも変わったら真っ先に気づいて抱きしめてくれる子だってこと。","형이 조금이라도 달라지면 누구보다 제가 먼저 알아요.":"ヒョンが少しでも変わったら、誰よりも先に僕が気づきます。","다음 날 아침. 눈이 퉁퉁 부어 있다. 식탁에 유진이 있다. 내 자리 앞에 따뜻한 물과 아이스팩이 놓여 있다.":"次の日の朝。目がぱんぱんに腫れている。食卓にユジンがいる。僕の席の前に、温かい水とアイスパックが置いてある。","눈 부었어요. 이거 대고 있어요. 스케줄 오후부터니까 더 자도 돼요.":"目、腫れてますよ。これ当ててください。スケジュールは午後からなので、もう少し寝てもいいですよ。","유진의 핸드폰이 울린다. 화면에 민준 이름이 뜬다. 유진은 핸드폰을 뒤집어 놓는다.":"ユジンのスマホが鳴る。画面に{M}の名前が出る。ユジンはスマホを裏返して置く。","김민준 형 연락이에요. 지금은 안 받을래요.":"{MF}ヒョンからです。今は出ません。","안 받는다. 나 때문에.":"出ないんだ。僕のせいで。","“지금은 내가 더 중요한 거야?”":"「今は僕のほうが大事なの？」","지금은 내가 더 중요한 거야?":"今は僕のほうが大事なの？","지금만 그런 거 아닌데요.":"今だけじゃないですけど。","유치하지만 한 번 더 확인하고 싶어졌다.":"子どもっぽいけど、もう一度確かめたくなった。","앞으로 나랑 다른 사람 중에 골라야 한다면?":"この先、僕とほかの人のどっちかを選ばなきゃいけなかったら？","제 선택은 항상 형이죠.":"僕が選ぶのは、いつだってヒョンです。","조금의 망설임도 없는 대답이었다.":"少しのためらいもない答えだった。","유진은 내 손에 들린 아이스팩을 가져가 부어오른 눈 위에 조심스레 얹어 주었다.":"ユジンは僕の手からアイスパックを取って、腫れたまぶたの上にそっとのせてくれた。","차가운 감촉 너머로 유진의 다정함이 고스란히 전해졌다.":"冷たい感触の向こうから、ユジンの優しさがそのまま伝わってきた。","“유진이가 해 줘.”":"「ユジンがやって」","아이스팩을 내밀자 유진이 잠깐 나를 본다. 그러다 핸드폰을 내려놓고 아이스팩을 받아 든다.":"アイスパックを差し出すと、ユジンが少し僕を見る。それからスマホを置いて、アイスパックを受け取る。","이리 와요. 눈 감고 있어요.":"こっち来てください。目を閉じてて。","차가운 아이스팩이 눈가에 닿는다. 그걸 대 주는 유진의 손이 이상하게 따뜻하다.":"冷たいアイスパックが目元に触れる。それを当ててくれるユジンの手が、妙に温かい。","“차가워. 나 이거 안 할래..”":"「冷たい。これやだ..」","차가워. 나 이거 안 할래..":"冷たい。これやだ..","안 돼요. 방송 전에 가라앉혀야 해요.":"ダメです。番組の前に腫れを引かせないと。","유진이 의자를 끌어와 내 옆에 앉는다. 아이스팩을 수건으로 한 번 감싸더니 내 눈가에 살며시 대 준다.":"ユジンが椅子を引き寄せて、僕の隣に座る。アイスパックをタオルでひと巻きして、僕の目元にそっと当ててくれる。","이러면 덜 차갑죠?":"これなら冷たくないでしょう？","투정 한 번에 이렇게 가까워질 줄은 몰랐다.":"ちょっと駄々をこねただけで、こんなに近づけるなんて思わなかった。","스케줄이 모두 끝난 밤, 숙소 베란다. 유진이 문을 닫고 내 앞에 선다. 평소처럼 담담한 얼굴인데 눈이 곧다.":"スケジュールが全部終わった夜、宿舎のベランダ。ユジンがドアを閉めて僕の前に立つ。いつもどおり落ち着いた顔なのに、目がまっすぐだ。","추운데 왜 나와 있어요.":"寒いのに、なんで外にいるんですか。","유진이 들고 온 겉옷을 내 어깨 위에 조심스레 둘러 주었다.":"ユジンが持ってきた上着を、僕の肩にそっとかけてくれた。","고마워.":"ありがとう。","어깨를 감싼 옷자락 사이로 희미한 온기가 스며들었다. 이상하게도 마음까지 따뜻해지는 기분이었다.":"肩を包んだ上着のすき間から、かすかな温もりがしみこんできた。不思議と、心まで温かくなる気がした。","저 이런 거 형한테만 해요.":"僕、こういうことヒョンにしかしませんよ。","뜻밖의 말에 아무런 대답도 하지 못했다. 그저 유진의 얼굴만 멍하니 바라보았다.":"思いがけない言葉に、何も答えられなかった。ただユジンの顔をぼんやり見つめていた。","제가 나중에 다 얘기해 준다고 했던 거, 기억해요?":"僕があとで全部話すって言ったこと、覚えてますか？","기억난다. 엉엉 울던 모습을 유진에게 들켜 버린 그날.":"覚えている。わんわん泣いていた姿を、ユジンに見られてしまったあの日。","부끄러운 기억이 선명하게 떠올라, 말없이 고개만 끄덕였다.":"恥ずかしい記憶がはっきりよみがえって、黙ってうなずくことしかできなかった。","그날, 민준 형한테 고민 상담하러 갔던 거예요.":"あの日、{M}ヒョンに相談しに行ってたんです。","또다시 민준의 이름이었다. 그 이름을 듣는 순간, 마음 한구석에 작은 정전기가 이는 듯했다.":"またしても{M}の名前だった。その名前を聞いた瞬間、心の片すみに小さな静電気が走ったような気がした。","형을 좋아하는데 어떻게 해야 될지 모르겠어서.":"ヒョンのことが好きなのに、どうしたらいいかわからなくて。","생각지도 못한 말에 고개를 번쩍 들었다. 유진은 잠시 나와 눈을 맞추더니, 이내 시선을 아래로 떨구었다.":"思いもよらない言葉に、ぱっと顔を上げた。ユジンは少しのあいだ僕と目を合わせて、すぐに視線を落とした。","…어떤 형?":"…どのヒョン？","유진이 당황한 듯 귀끝까지 빨개지더니, 말없이 손가락으로 나를 가리켰다.":"ユジンがうろたえたように耳の先まで赤くなって、黙って指で僕をさした。","“…유진아, 너 나 좋아해?”":"「…ユジナ、僕のこと好きなの？」","…유진아, 너 나 좋아해?":"…ユジナ、僕のこと好きなの？","유진이 눈을 피하지 않고 고개를 끄덕인다.":"ユジンが目をそらさずにうなずく。","네. 좋아해요, 형.":"はい。好きです、ヒョン。","…나만 그런 게 아니었구나.":"…僕だけじゃなかったんだ。","“나도 유진이 좋아하지…”":"「僕だってユジンのこと好きだよ…」","나도 유진이 좋아하지…":"僕だってユジンのこと好きだよ…","유진이 한 걸음 다가와 내 어깨를 잡으며 말했다.":"ユジンが一歩近づいて、僕の肩をつかみながら言った。","형이 나한테만 잘해 줬으면 좋겠고, 나한테만 웃어 줬으면 좋겠고, 형이 제일 먼저 찾는 사람도 나였으면 좋겠어요.":"ヒョンが僕にだけ優しくしてくれたらいいし、僕にだけ笑ってくれたらいいし、ヒョンがいちばん最初に探す人も僕だったらいいなって思います。","뭐라고 말해야 할지 몰라 아무 말도 하지 못했다.":"何と言えばいいかわからなくて、何も言えなかった。","대답을 못 하고 시선을 피한다":"答えられずに目をそらす","도망가도 되는데, 오늘은 그냥 듣고 있어요.":"逃げてもいいけど、今日はただ聞いててください。","유진의 목소리가 낮다. 도망칠 곳은 사실 없다.":"ユジンの声が低い。逃げる場所なんて、本当はない。","나 말고 다른 사람이랑 더 친해지는 것도 싫고, 형이 다른 사람한테 나한테 하듯이 다정하게 구는 것도 싫어요.":"僕以外の人ともっと仲良くなるのも嫌だし、ヒョンがほかの人に僕にするみたいに優しくするのも嫌です。","당황스러운 마음을 추스를 새도 없이 유진의 말이 이어졌다.":"戸惑う気持ちを落ち着ける間もなく、ユジンの言葉が続いた。","그냥 형이 나만 봤으면 좋겠어요. 나만 생각하고, 나만 보고 싶어 하고, 힘들 때도 나한테만 기대고……":"ただヒョンに僕だけを見てほしいんです。僕のことだけ考えて、僕にだけ会いたがって、つらいときも僕にだけ頼って……","한마디도 보태지 못한 채 그저 유진을 바라보았다. 귓가에 열이 오르는 것이 느껴졌다.":"一言も足せないまま、ただユジンを見つめた。耳元が熱くなっていくのがわかった。","……형도 그래요?":"……ヒョンもそうですか？","쉴 새 없이 이어지던 고백이 멎었다. 대답을 기다리는 유진의 눈빛에는 간절함이 가득 담겨 있었다.":"止まることなく続いていた告白が途切れた。答えを待つユジンの瞳には、切実さがいっぱいに込められていた。","“나도 유진이랑 같은 마음인 것 같아.”":"「僕もユジンと同じ気持ちみたい」","나도 유진이랑 같은 마음인 것 같아.":"僕もユジンと同じ気持ちみたい。","괜한 부끄러움에 애써 감춰 왔던 마음을 조심스레 내어 보였다. 입 밖으로 꺼내고 나니, 그동안 마음 한편에 쌓여 있던 서운함마저 사르르 녹아내리는 듯했다.":"わけもない恥ずかしさで隠してきた気持ちを、そっと差し出した。口に出してしまうと、これまで心の片すみに積もっていた寂しさまで、すうっと溶けていくようだった。","사랑한다고 말해 주세요.":"愛してるって言ってください。","사랑을 갈구하는 욕심스러운 말에 조금 놀라 유진을 바라보았다. 가슴 한편이 뜨거워지는 듯했다. 그토록 간절하게 내 사랑을 바라는 모습이 어쩐지 애틋하고 사랑스러웠다.":"愛を求める欲張りな言葉に少し驚いて、ユジンを見つめた。胸の奥が熱くなるようだった。あんなに切実に僕の愛を欲しがる姿が、なんだか切なくて愛おしかった。","사랑해라고 해 줘.":"愛してるって言って。","마치 어린아이처럼 떼를 쓰듯, 반말로 다시 한번 사랑을 요구했다.":"まるで子どもがだだをこねるみたいに、今度はタメ口でもう一度愛をねだった。","사랑해.":"愛してる。","사랑을 보채는 유진을 바라보며 다정하게 말했다. 그 짧은 한마디에 담긴 마음만큼은 조금도 가볍지 않았다.":"愛をせがむユジンを見つめながら、優しく言った。その短い一言に込めた気持ちだけは、少しも軽くなかった。","“……겁이 나.”":"「……怖いんだ」","……겁이 나.":"……怖いんだ。","그토록 듣고 싶었던 말이었다. 그러나 벅찬 기쁨이 자리해야 할 곳에 어둡고 짙은 안개가 내려앉았다.":"あんなに聞きたかった言葉だった。なのに、あふれる喜びがあるべき場所に、暗く濃い霧が降りてきた。","더 가까워진다는 건, 언젠가 지금보다 더 멀어질 수도 있다는 뜻이니까.":"もっと近づくってことは、いつか今よりもっと遠くなるかもしれないってことだから。","함께한 추억도, 당연하게 나누었던 일상도, 무심히 건네던 사소한 손길마저도 언젠가는 전부 잃게 되면 어떡하지.":"一緒に作った思い出も、当たり前に分け合ってきた日常も、何気なく触れていた小さなぬくもりさえも、いつか全部失ってしまったらどうしよう。","저는 겁 하나도 안 나요.":"僕は怖くなんて、全然ありません。","조금의 망설임도 없는 목소리. 그 속에 옅은 소나기가 내린다.":"少しのためらいもない声。その中に、かすかな通り雨が降る。","전부 다 너무 헷갈려. 뭐가 맞는지 모르겠어……":"全部わからなくなっちゃった。何が正しいのかわからない……","이 마음으로 저 사랑을 지켜낼 자신이 없었다.":"こんな気持ちで、あの愛を守り抜ける自信がなかった。","잠시 나를 응시하던 유진이 이내 몰아세우듯 물었다.":"しばらく僕を見つめていたユジンが、やがて問い詰めるように聞いた。","형은 내가 다른 사람 좋아해도 괜찮아요? 다른 사람이랑 만나고, 그 사람한테 사랑한다고 해도?":"ヒョンは、僕がほかの人を好きになっても平気なんですか？ほかの人と付き合って、 function tone(f,d,v){const a=au_();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}

const B2=new Set(['l','n','o','R','eT','eS','eG','eN']);const trkW=()=>{if(!st)return'bgm.mp3';if(st.id==='eN'||(st.id==='o'&&st.nx==='eN'))return'bgm.mp3';return B2.has(st.id)?'bgm2.mp3':'bgm.mp3'};function xf(){if(!bgm.src.endsWith(trkW())&&!bgm.paused){duck(0);setTimeout(()=>{bgm.volume=0;playBgm();duck(.45)},700)}}function trk(){const w=trkW();if(!bgm.src.endsWith(w)){bgm.src=w;bgm.currentTime=0}}

function draw(l){clearInterval(ty);ty=0;st.last=l;stopTyping();if(l[4]==='typing')setTimeout(typing,0);const w=l[0],nm=$('nm'),isT=w==='TH'||w==='TY';$('tap').classList.toggle('on',isT);if(isT){nm.style.display='none';$('box').className='tin done';full=l[1];st.lg.push(l);if(st.lg.length>120)st.lg.shift();stopVo();renderChat();if(sf&&!sk)tone(w==='TH'?880:740,.06,.03);fin();return}nm.textContent=nz(NM[w]||'');nm.style.display=w==='N'?'none':'';nm.className='n'+w;const b=$('box');b.className=(w==='M'?'mono':w==='N'?'nar':'sp')+' s'+w;b.innerHTML='<span id="tx"></span><small></small>';full=nz(l[1]);const tx=$('tx');tx.textContent=full;b.classList.add('done');st.lg.push(l);if(st.lg.length>120)st.lg.shift();if(l[3])playVo(l[3]);else{stopVo();if(sf&&!sk)tone(w==='M'?523:w==='Y'?660:w==='G'?587:440,.05,.03)}if(!ty)fin()}
